<title>Heavenly Tribulation</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #0a0812; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0812; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
<canvas id="view" role="img" aria-label="Pixel art cultivator meditating on a bare mountain summit at night as dark clouds spiral overhead, three purple lightning bolts strike and a golden core flares until the clouds part to starlight"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 128, H = 96;             // logical resolution
const PLAT_Y = 75;                 // top of the summit plateau
const FY = PLAT_Y - 1;             // debris bounces on the plateau; strays off its edge are culled
const POSE_STEP = 6;               // 10 fps pose frames
const AX = 64;                     // cultivator x
const EYE_X = 64, EYE_Y = 8;       // eye of the cloud vortex, where the bolts come from

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#0a0812',
  '#121833', '#1b2348', '#28305e', '#7880b8', '#161b38',
  '#17151f', '#2e2c40', '#4a4862', '#767496',
  '#0e0a18', '#221a34', '#3c2e58', '#6e4ea0',
  '#6a2ad8', '#a060ff', '#d8b0ff', '#ffffff',
  '#b8701c', '#f0a830', '#ffe070', '#fff8d0',
  '#3e4258', '#62687e', '#9096b0', '#7a2a44',
  '#0e0c18', '#221e30', '#3a3450',
  '#a8746a', '#e0b49c',
];
const INK = 0, SKY0 = 1, SKY1 = 2, SKY2 = 3, STAR = 4, MT = 5, ROCK_D = 6, ROCK_M = 7, ROCK_L = 8, ROCK_H = 9,
  CL_D = 10, CL_M = 11, CL_L = 12, CL_H = 13, BOLT_D = 14, BOLT_M = 15, BOLT_L = 16, WHITE = 17,
  GOLD_D = 18, GOLD_M = 19, GOLD_L = 20, GOLD_W = 21, ROBE_D = 22, ROBE_M = 23, ROBE_L = 24, SASH = 25,
  HAIR_D = 26, HAIR_M = 27, HAIR_L = 28, SKIN_D = 29, SKIN_L = 30;

// One step brighter per ramp; lightning tints the night sky and rock violet.
const LIGHTEN = Uint8Array.of(
  HAIR_M,
  SKY1, SKY2, CL_L, WHITE, SKY2,
  ROCK_M, ROCK_L, ROCK_H, BOLT_L,
  CL_M, CL_L, CL_H, BOLT_L,
  BOLT_M, BOLT_L, WHITE, WHITE,
  GOLD_M, GOLD_L, GOLD_W, WHITE,
  ROBE_M, ROBE_L, WHITE, SASH,
  HAIR_M, HAIR_L, ROBE_D,
  SKIN_L, GOLD_W);
const RAMP_BOLT = Uint8Array.of(WHITE, BOLT_L, BOLT_M, BOLT_D);
const RAMP_GOLD = Uint8Array.of(GOLD_W, GOLD_L, GOLD_M, GOLD_D);
const RAMP_ROCK = Uint8Array.of(ROCK_H, ROCK_L, ROCK_M, ROCK_D);
const RAMP_QI = Uint8Array.of(WHITE, STAR, SKY2, SKY1);
const RAMPS = [RAMP_BOLT, RAMP_GOLD, RAMP_ROCK, RAMP_QI];
const RIM = Uint8Array.of(BOLT_M, BOLT_L, WHITE);
const RIM_BANDS = Uint16Array.of(10, 18, 28);
const LIGHT = Float32Array.of(-0.5, -0.87);   // starlight from high on the left
const RIM_OK = new Uint8Array(PAL.length).fill(1);
RIM_OK[GOLD_D] = RIM_OK[GOLD_M] = RIM_OK[GOLD_L] = RIM_OK[GOLD_W] = 0; // glowing eyes keep their gold
const AIR = new Uint8Array(PAL.length);
AIR[SKY0] = AIR[SKY1] = AIR[SKY2] = AIR[STAR] = AIR[CL_D] = AIR[CL_M] = AIR[CL_L] = 1;

// Head facing us, 7x7: h/H hair, s/d skin
const HEAD = ['.hhhhh.', 'hHHHHHh', 'hhsssHh', 'hsssssh', 'hsssssh', 'hsssssh', '.hssdh.'];
const LAP_W = Int8Array.of(8, 10, 12, 12, 11);    // crossed-leg half widths, waist to hem

const MEDITATE = 0, GATHER = 1, STRIKE = 2, BREAK = 3, SETTLE = 4;
const DUR = Uint16Array.of(96, 108, 120, 72, 84); // L = 480: wind 80, star cycle 160
const EASE = Uint16Array.of(6, 48, 12, 6, 72);
const EASE_OUT = Uint8Array.of(0, 0, 0, 1, 0);
const BOLT_T = Uint8Array.of(6, 42, 78);          // the three strikes, in STRIKE ticks
const FIRE_T = 6;                                 // the core flares, in BREAK ticks
const ARMS = 0, BRACE = 1, GAZE = 2, NP = 3;
const REST = Float32Array.of(0, 0, 0);            // hands in the lap, eyes closed
const TARGET = [
  REST,
  Float32Array.of(1, 0.5, 0),                     // palms pressed together before the chest
  Float32Array.of(1, 1, 0),                       // hunched, bracing for the strikes
  Float32Array.of(2, 0, 1),                       // arms flung open, eyes blazing gold
  REST,
];
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
const SKY_ROWS = 56;                              // clouds never reach below this row
const CTH = new Float32Array(W * SKY_ROWS), CR = new Float32Array(W * SKY_ROWS); // polar coords around the eye
const headMap = new Uint8Array(49);
const TWINKLE = Uint8Array.of(14, 9, 41, 22, 97, 14, 116, 30);                 // bright stars as x, y
const BPX = new Int16Array(11), BPY = new Int16Array(11);                     // bolt path, eye to crown
const BFX = new Int16Array(10), BFY = new Int16Array(10);                     // two forks of 5 points
const CKX = new Int16Array(6), CKY = new Int16Array(6);                       // crackle inside the clouds
const LV = new Float32Array(2);                   // cloud cover 0-1, radius of the parting hole
let boltAge = 99, boltN = 0, crackAge = 99, flareAge = 99;
let cx = 0, seatY = 0, hipY = 0, chestY = 0, hy = 0, elDX = 0, elY = 0, hdDX = 0, hdY = 0;
let qHair = 0, qLift = 0, qEyes = 0, qCore = 0;

function buildBackground() {
  const seed = Uint32Array.of(20240917);
  const rnd = () => { let x = seed[0]; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; seed[0] = x; return seed[0] / 4294967296; };
  const dith = (x, y, v) => v * 16 > BAYER[(y & 3) * 4 + (x & 3)];
  const EDGE = [0, 28, 48, 999];
  for (let y = 0; y < H; y++) {
    let b = 0;
    while (y >= EDGE[b + 1]) b++;
    const seam = b < 2 && y === EDGE[b + 1] - 1; // one dithered row joins each band to the next
    for (let x = 0; x < W; x++) bg[y * W + x] = SKY0 + b + (seam && dith(x, y, 0.5) ? 1 : 0);
  }
  for (let n = 0; n < 150; n++) { // a faint river of stars across the sky
    const x = rnd() * W | 0, y = Math.round(38 - x * 0.28 + (rnd() + rnd() - 1) * 7);
    if (y >= 0) plot(bg, x, y, n % 9 ? SKY2 : STAR);
  }
  for (let n = 0; n < 46; n++) plot(bg, rnd() * W | 0, rnd() * 54 | 0, rnd() < 0.3 ? WHITE : STAR);
  for (let k = 0; k < TWINKLE.length; k += 2) plot(bg, TWINKLE[k], TWINKLE[k + 1], WHITE);
  // Far ranges, then the bare summit: flat crown, a lit left face, the right face in shadow.
  for (let x = 0; x < W; x++) {
    const top = Math.round(64 + 4 * Math.sin(x * 0.07 + 1) + 3 * Math.sin(x * 0.19) - 3 * Math.abs(Math.sin(x * 0.11 + 2)));
    plot(bg, x, top, SKY2);
    for (let y = top + 1; y < H; y++) plot(bg, x, y, MT);
  }
  for (let y = PLAT_Y; y < H; y++) {
    const d = y - PLAT_Y, xl = Math.round(40 - d * 1.5 + Math.sin(y * 0.9) * 1.2), xr = Math.round(88 + d * 1.6 + Math.sin(y * 1.3 + 1) * 1.2);
    for (let x = xl; x <= xr; x++) {
      let c = y === PLAT_Y || x < xl + 2 ? ROCK_L : x > AX + 6 + d * 0.8 ? ROCK_D : ROCK_M;
      if (c === ROCK_M && d > 8 && dith(x, y, Math.min(1, (d - 8) / 6))) c = ROCK_D;
      if ((x * 3 + y * 7) % 23 === 0 && y > PLAT_Y + 2) c = ROCK_D;              // cracks and pits
      plot(bg, x, y, c);
    }
  }
  for (let x = 41; x < 88; x++) if (Math.sin(x * 0.8) > 0.6) plot(bg, x, PLAT_Y - 1, ROCK_L); // broken crown
  hline(bg, AX - 12, AX + 12, PLAT_Y, ROCK_M); // shadow under the cultivator

  for (let y = 0; y < SKY_ROWS; y++) {
    for (let x = 0; x < W; x++) { // squashed: the vortex is seen from below at an angle
      const dx = x - EYE_X, dy = (y - EYE_Y) * 1.6;
      CTH[y * W + x] = Math.atan2(dy, dx); CR[y * W + x] = Math.hypot(dx, dy);
    }
  }
  const HMAP = { '.': EMPTY, h: HAIR_M, H: HAIR_L, s: SKIN_L, d: SKIN_D };
  HEAD.forEach((row, y) => { for (let x = 0; x < 7; x++) headMap[y * 7 + x] = HMAP[row[x]]; });
}

// Freeze the smooth pose onto the pixel grid; the sprite only changes on these frames.
function sample() {
  snap.set(pose);
  const a = pose[ARMS], u = Math.min(1, a), v = Math.max(0, a - 1);
  const jolt = Math.max(0, Math.min(2, Math.round(spring[2]))), brace = Math.round(pose[BRACE]);
  qHair = Math.max(-3, Math.min(3, Math.round(spring[0])));
  qEyes = pose[GAZE] > 0.5 ? 1 : 0;
  qLift = state === BREAK && stT >= FIRE_T && stT < 54 ? 1 : 0;
  cx = AX; seatY = PLAT_Y - 1; hipY = seatY - 4;
  chestY = hipY - 11 + jolt; hy = chestY - 8 + brace;
  // Hand and elbow keyframes (right side, mirrored): lap, palms together at the chest, flung wide.
  hdDX = Math.round(2 - u + v * 12); hdY = Math.round(hipY + (chestY + 4 - hipY) * u - 5 * v);
  elDX = Math.round(8 - u + v * 3); elY = Math.round(hipY - 2 + (chestY + 9 - hipY) * u - 4 * v);

  if (state === STRIKE && stT >= 96) qCore = 1;
  else if (state === BREAK) qCore = stT < FIRE_T ? 1 : stT < 36 ? 3 : 2;
  else if (state === SETTLE) qCore = stT < 30 ? 2 : stT < 60 ? 1 : 0;
  else qCore = 0;
  srcX = cx; srcY = hy - 14;
  if (state === STRIKE) { srcY = hy - 4; rim = boltAge < 4 ? 6 : boltAge < 10 ? 4 : boltAge < 20 ? 3 : 2; }
  else if (state === BREAK) rim = stT < FIRE_T ? 2 : stT < FIRE_T + 12 ? 3 : 2;
  else rim = state === GATHER && stT >= 72 ? 2 : 1;
}

function step() {
  const wind = state === GATHER ? stT / DUR[GATHER] : state === STRIKE ? 1 : 0;
  stepSpring(0, wind * 2.5 * Math.sin(tick / 80 * 6.2832)); // hair whips in the vortex wind
  stepSpring(2, 0);                                          // jolt from each strike
  boltAge++; crackAge++; flareAge++;
  if (tick % POSE_STEP === 0) sample();

  const f = stT - FIRE_T;
  LV[0] = state === GATHER ? 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, stT / 96)) : state === STRIKE || state === BREAK ? 1 : 0;
  LV[1] = state === BREAK && f >= 0 ? 110 * Math.min(1, f / 54) * (2 - Math.min(1, f / 54)) : 0;
  if (state === GATHER && (stT === 66 || stT === 90)) crackle();
  for (let k = 0; k < 3; k++) if (state === STRIKE && stT === BOLT_T[k]) bolt(k);
  if (state === BREAK && stT === FIRE_T) flare();

  if ((state === MEDITATE || (state === SETTLE && stT >= 48)) && stT % 10 === 5) // quiet qi rising
    spawn(MOTE, 40 + rand() * 30, cx + (rand() - 0.5) * 26, hipY + 2 - rand() * 4, 0, -0.15 - rand() * 0.1, 3);
  if ((state === GATHER && stT > 30 && stT % 4 === 0) || (state === STRIKE && stT % 3 === 0)) // grit on the wind
    spawn(TRAIL, 16 + rand() * 16, 40 + rand() * 48, PLAT_Y - 1 - rand() * 6, 1 + rand() * 1.2, -0.15 - rand() * 0.2, 2);
  if ((state === BREAK && f >= 0 && f < 42 && f % 3 === 0) || (state === SETTLE && stT < 36 && stT % 6 === 0))
    spawn(MOTE, 36 + rand() * 30, cx + (rand() - 0.5) * 20, chestY + 4 + (rand() - 0.5) * 10, 0, -0.3 - rand() * 0.2, 1);
  for (let i = 0; i < MAXP; i++) if (pKind[i] && py[i] > 70 && (px[i] < 38 || px[i] > 90)) pKind[i] = 0; // off the edge
}

function bolt(k) {
  const tx = cx, ty = hy - 4; // strikes the crown
  BPX[0] = EYE_X; BPY[0] = EYE_Y + 3;
  for (let i = 1; i < 11; i++) {
    const t = i / 10;
    BPX[i] = Math.round(EYE_X + (tx - EYE_X) * t + (i < 10 ? (rand() - 0.5) * 12 * (1 - t * 0.6) : 0));
    BPY[i] = Math.round(BPY[0] + (ty - BPY[0]) * t);
  }
  for (let fk = 0; fk < 2; fk++) { // two forks peel off the upper half
    const s = 2 + (rand() * 4 | 0), dir = fk ? 1 : -1;
    BFX[fk * 5] = BPX[s]; BFY[fk * 5] = BPY[s];
    for (let j = 1; j < 5; j++) {
      BFX[fk * 5 + j] = BFX[fk * 5 + j - 1] + dir * (2 + (rand() * 4 | 0));
      BFY[fk * 5 + j] = BFY[fk * 5 + j - 1] + 2 + (rand() * 3 | 0);
    }
  }
  boltAge = 0; boltN = k; flashT = k === 2 ? 4 : 3; shakeT = k === 2 ? 14 : 10; spring[3] += 0.25;
  for (let n = 0; n < 12; n++) spawn(BURST, 10 + rand() * 14, tx, ty, (rand() - 0.5) * 2.4, -rand() * 1.6, 0);
  for (let n = 0; n < 6; n++) spawn(BURST, 20 + rand() * 20, cx + (rand() - 0.5) * 26, PLAT_Y - 1, (rand() - 0.5) * 1.4, -0.5 - rand() * 1.2, 2);
}
function crackle() {
  CKX[0] = Math.round(EYE_X + (rand() - 0.5) * 70); CKY[0] = Math.round(6 + rand() * 16);
  for (let i = 1; i < 6; i++) { CKX[i] = CKX[i - 1] + Math.round((rand() - 0.3) * 8); CKY[i] = CKY[i - 1] + Math.round((rand() - 0.5) * 5); }
  crackAge = 0;
}
function flare() {
  flareAge = 0; flashT = 3; shakeT = 12;
  for (let n = 0; n < 20; n++) {
    const t = n / 20 * 6.283 + rand() * 0.3, v = 0.8 + rand() * 1.2;
    spawn(TRAIL, 14 + rand() * 12, cx, chestY + 4, Math.cos(t) * v, Math.sin(t) * v * 0.8, 1);
  }
}

function drawActor() {
  // Long hair behind the shoulders, whipped by the wind or lifted by the surge.
  capsule(spr, cx, hy + 3, 4, cx + qHair, chestY + 7, 3, HAIR_D, HAIR_M, HAIR_L);
  for (let s = -1; s <= 1; s += 2) {
    const ex = cx + s * (qLift ? 10 : 7) + qHair, ey = qLift ? hy + 5 : chestY + 6;
    capsule(spr, cx + s * 3, hy + 2, 1.6, ex, ey, 1, HAIR_D, HAIR_M, HAIR_L);
  }
  // Crossed legs under the robe, then the torso with a wine-trimmed collar and sash.
  for (let r = 0; r < 5; r++) {
    const w = LAP_W[r];
    for (let x = cx - w; x <= cx + w; x++) {
      let c = r === 4 ? ROBE_D : x < cx - w + 2 ? ROBE_L : x > cx + w - 2 ? ROBE_D : ROBE_M;
      if (r >= 2 && r < 4 && (x === cx - 4 || x === cx + 4)) c = ROBE_D; // where the shins cross
      plot(spr, x, hipY + r, c);
    }
  }
  for (let i = 0; i < 11; i++) {
    const w = i === 0 ? 5 : i < 8 ? 6 : 5, v = Math.round(3 - i * 0.6);
    for (let x = cx - w; x <= cx + w; x++) {
      const ax = Math.abs(x - cx);
      let c = x <= cx - w + 1 ? ROBE_L : x >= cx + w - 1 ? ROBE_D : ROBE_M;
      if (i < 6 && ax === v) c = SASH;
      else if (i < 6 && ax < v) c = i < 2 ? SKIN_L : ROBE_L;
      if (i === 8 || i === 9) c = SASH;
      plot(spr, x, chestY + i, c);
    }
  }
  // Arms in wide sleeves.
  for (let s = -1; s <= 1; s += 2) {
    const ex = cx + s * elDX, hx0 = cx + s * hdDX, fdx = hx0 - ex, fdy = hdY - elY, fl = Math.hypot(fdx, fdy) || 1;
    const wx = Math.round(hx0 - fdx / fl * 1.5), wy = Math.round(hdY - fdy / fl * 1.5);
    capsule(spr, cx + s * 6, chestY + 1, 2.2, ex, elY, 2.2, ROBE_D, ROBE_M, ROBE_L);
    capsule(spr, ex, elY, 2.2, wx, wy, 2.4, ROBE_D, ROBE_M, ROBE_L);
    rect(spr, s > 0 ? hx0 - 1 : hx0, hdY - 1, 2, 2, SKIN_L);
  }
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 7; c++) {
      const v = headMap[r * 7 + c];
      if (v !== EMPTY) plot(spr, cx - 3 + c, hy + r, v);
    }
  }
  hline(spr, cx - 2, cx + 2, hy - 1, HAIR_M); hline(spr, cx - 1, cx + 1, hy - 2, HAIR_L); // round topknot, pinned
  plot(spr, cx - 3, hy - 1, GOLD_M); plot(spr, cx + 3, hy - 1, GOLD_M);
  const eye = qEyes ? GOLD_L : INK;
  hline(spr, cx - 2, cx - 1, hy + 3, eye); hline(spr, cx + 1, cx + 2, hy + 3, eye);
}

function ringOut(x0, y0, r, c) { // a ring that passes behind the actor
  r = Math.round(r);
  const n = Math.max(16, Math.round(r * 7));
  for (let k = 0; k < n; k++) {
    const x = Math.round(x0 + Math.cos(k * 6.2832 / n) * r), y = Math.round(y0 + Math.sin(k * 6.2832 / n) * r * 0.7);
    if (x >= 0 && x < W && y >= 0 && y < H && spr[y * W + x] === EMPTY) buf[y * W + x] = c;
  }
}

function drawClouds() {
  const cov = LV[0], hole = LV[1];
  if (cov <= 0) return;
  const rot = tick * 0.021, lit = boltAge < 6 || crackAge < 4;
  for (let y = 0; y < SKY_ROWS; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, r = CR[i], th = CTH[i];
      if (r < hole) continue;
      // One dark mass with a scalloped rim, three pale arms winding into the eye.
      const R = cov * (60 + 7 * Math.sin(5 * th + rot * 1.3) + 5 * Math.sin(2 * th - rot));
      if (r > R) continue;
      const arm = Math.sin(3 * th + 0.24 * r - rot * 2);
      let c = arm > 0.82 ? CL_L : arm > 0.15 || r < 7 ? CL_M : CL_D;
      if (r > R - 1.5 || (hole > 0 && r < hole + 2)) c = CL_L;
      buf[i] = lit && c === CL_L ? CL_H : c;
    }
  }
  if (hole === 0 && cov > 0.8) disc(EYE_X, EYE_Y, 2, boltAge < 4 ? WHITE : boltAge < 10 ? BOLT_L : BOLT_M); // the eye smoulders
}

function drawUnder() {
  for (let k = 0; k < TWINKLE.length; k += 2) { // bright stars flare in turn, one full cycle every 160 ticks
    if (((tick / 40 | 0) + (k >> 1)) % 4) continue;
    const x = TWINKLE[k], y = TWINKLE[k + 1];
    plot(buf, x - 1, y, STAR); plot(buf, x + 1, y, STAR); plot(buf, x, y - 1, STAR); plot(buf, x, y + 1, STAR);
  }
  drawClouds();
}

function drawBolt() {
  if (boltAge >= 12 || (boltAge >= 4 && boltAge & 1)) return; // flickers out
  const core = boltAge < 4 ? WHITE : BOLT_L, edge = boltAge < 4 ? BOLT_L : BOLT_M;
  for (let i = 0; i < 10; i++) {
    line(buf, BPX[i] + 1, BPY[i], BPX[i + 1] + 1, BPY[i + 1], edge);
    if (boltN === 2) line(buf, BPX[i] - 1, BPY[i], BPX[i + 1] - 1, BPY[i + 1], edge); // the last bolt is the heaviest
    line(buf, BPX[i], BPY[i], BPX[i + 1], BPY[i + 1], core);
  }
  for (let j = 0; j < 10; j++) if (j % 5 < 4) line(buf, BFX[j], BFY[j], BFX[j + 1], BFY[j + 1], BOLT_M);
  if (boltAge < 3) halo(BPX[10], BPY[10], 8, BOLT_L, BOLT_M);
  if (boltAge < 8) ringOut(cx, chestY + 4, 10 + boltAge * 1.5, boltAge < 4 ? BOLT_L : BOLT_D);
}

function drawOver() {
  drawParticles(false);
  if (qCore > 0) { // the golden core glows through the robe
    const y = chestY + 4;
    lighten(cx, y, 2 + qCore * 2);
    if (qCore > 1) disc(cx, y, qCore - 1, GOLD_L);
    plot(buf, cx, y, GOLD_W);
  }
  if (flareAge < 24) {
    const y = chestY + 4, f = flareAge;
    if (f < 3) halo(cx, y, 16, GOLD_L, GOLD_M);
    if (f < 14) { // eight rays, dithered, behind the body
      for (let k = 0; k < 8; k++) {
        const dx = Math.cos(k * 0.785 + 0.39), dy = Math.sin(k * 0.785 + 0.39);
        for (let s = 6; s < 10 + f * 3; s++) {
          const x = Math.round(cx + dx * s), yy = Math.round(y + dy * s * 0.8);
          if (x >= 0 && x < W && yy >= 0 && yy < H && ((s + f) & 1) && spr[yy * W + x] === EMPTY) buf[yy * W + x] = GOLD_L;
        }
      }
    }
    ringOut(cx, y, 4 + f * 2.2, f < 6 ? GOLD_W : f < 12 ? GOLD_L : f < 18 ? GOLD_M : GOLD_D);
    if (f >= 6) ringOut(cx, y, 4 + (f - 6) * 2.2, f < 12 ? GOLD_L : GOLD_M);
  }
  drawBolt();
  if (crackAge < 6 && !(crackAge & 1)) for (let i = 0; i < 5; i++) line(buf, CKX[i], CKY[i], CKX[i + 1], CKY[i + 1], BOLT_L);
  drawParticles(true);
}
// #endregion

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
}
// #endregion
})();
</script>
