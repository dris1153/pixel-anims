<title>The Twelve Labors of Heracles</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #0b090e; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b090e; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
<canvas id="view" role="img" aria-label="Pixel art of the Twelve Labors of Heracles painted on an Attic black-figure amphora that turns slowly on a stone plinth in a dark room lit by an oil lamp: black silhouettes with incised lines and touches of purple-red and white come alive as each scene faces front; at Delphi the Pythia on her tripod sends the kneeling hero to serve Eurystheus; he strangles the Nemean lion and wears its hide, hacks at the Hydra while new heads spill over the border and Iolaus sears the necks, chases the golden-antlered hind, carries the Erymanthian boar out of the snow as Eurystheus hides in his jar, turns two rivers through the Augean stables so the painted water pours down the glaze, rattles the Stymphalian birds off the vase and shoots them in the lamplight, forces the Cretan bull to its knees, leads the bridled mares of Diomedes, takes the belt of the Amazon queen Hippolyta, raises the two pillars and drives home the red cattle of Geryon, holds up the starry sky while Atlas brings the golden apples, and drags three-headed Cerberus out of Hades into the dawn; flames rise from the pyre on Mount Oeta, Athena carries him up in her chariot and he dissolves into gold stars that become the constellation Hercules in the dark, and the lamp softens as the vase turns back to Delphi"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 160, H = 90;             // logical resolution
const FY = H - 1;                  // no floor for particles: spill FX are culled at the plinth in step()
const POSE_STEP = 6;               // 10 fps pose frames
const CX = 80;                     // the axis of the amphora
const FLX = 16, FLY = 32;          // the oil lamp flame

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#0b090e',
  '#110f18', '#19151f', '#231c26', '#33252a', '#4a3024',
  '#2c2626', '#4d433e', '#786858',
  '#151012', '#221a1a', '#382a26', '#5a463c', '#9a8674',
  '#5a2a16', '#8a4020', '#b85a2a', '#d8783a', '#eea058',
  '#4a1216', '#782026', '#a23038',
  '#9c8e7c', '#d0c4ac', '#f2e8d2',
  '#a0601c', '#e09a30', '#ffd46a', '#fff4c8',
  '#3e6a74', '#86b4b8',
];
const INK = 0, ROOM_A = 1, ROOM_B = 2, ROOM_C = 3, ROOM_D = 4, ROOM_E = 5,
  STONE_D = 6, STONE_M = 7, STONE_L = 8,
  GLZ_0 = 9, GLZ_1 = 10, GLZ_2 = 11, GLZ_3 = 12, GLZ_S = 13,
  CLAY_0 = 14, CLAY_1 = 15, CLAY_2 = 16, CLAY_3 = 17, CLAY_4 = 18,
  RED_D = 19, RED_M = 20, RED_L = 21, WHT_D = 22, WHT_M = 23, WHT_L = 24,
  GOLD_D = 25, GOLD_M = 26, GOLD_L = 27, FLAME = 28, WAT_D = 29, WAT_L = 30;

// One step brighter per ramp; the room warms toward the lamp, glaze climbs to its sheen.
const LIGHTEN = Uint8Array.of(
  ROOM_A,
  ROOM_B, ROOM_C, ROOM_D, ROOM_E, GOLD_D,
  STONE_M, STONE_L, WHT_D,
  GLZ_1, GLZ_2, GLZ_3, GLZ_S, WHT_M,
  CLAY_1, CLAY_2, CLAY_3, CLAY_4, GOLD_L,
  RED_M, RED_L, CLAY_4,
  WHT_M, WHT_L, FLAME,
  GOLD_M, GOLD_L, FLAME, FLAME,
  WAT_L, WHT_L);
const R_EMBER = 0, R_BLOOD = 1, R_WATER = 2, R_FEATHER = 3, R_STAR = 4;
const RAMPS = [
  Uint8Array.of(FLAME, GOLD_L, GOLD_M, GOLD_D, RED_D),
  Uint8Array.of(RED_L, RED_M, RED_D, GLZ_0),
  Uint8Array.of(WHT_L, WAT_L, WAT_D, GLZ_1),
  Uint8Array.of(GOLD_L, GOLD_M, GOLD_D, CLAY_0),
  Uint8Array.of(FLAME, GOLD_L, GOLD_M, GOLD_D),
];
const RIM = Uint8Array.of(GOLD_M, GOLD_L, FLAME);
const RIM_BANDS = Uint16Array.of(30, 60, 95);   // only the heads nearest the lamp catch it
const LIGHT = Float32Array.of(-0.8, -0.6);      // the lamp, low on the left
const RIM_OK = new Uint8Array(PAL.length).fill(1);
RIM_OK[RED_L] = RIM_OK[WHT_L] = 0;              // the forked tongues and eyes of the Hydra
const AIR = new Uint8Array(PAL.length);
AIR[ROOM_A] = AIR[ROOM_B] = AIR[ROOM_C] = AIR[ROOM_D] = 1;

const VASE = 0, ORACLE = 1, LION = 2, HYDRA = 3, HIND = 4, BOAR = 5, STABLES = 6, BIRDS = 7, BULL = 8, MARES = 9,
  BELT = 10, CATTLE = 11, APPLES = 12, CERBERUS = 13, OLYMPUS = 14, RETURN = 15;
const DUR = Uint16Array.of(90, 102, 108, 108, 108, 108, 108, 108, 108, 108, 108, 108, 108, 108, 108, 84); // L = 1680
const EASE = new Uint16Array(16).fill(6);
const EASE_OUT = new Uint8Array(16);
const NP = 1;                                   // every beat is scripted per panel from the loop clock
const REST = Float32Array.of(0);
const TARGET = Array.from({ length: 16 }, () => REST);
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const ctl = new Int32Array(3);      // embedding control: paused, fast-forward ticks left, fast-forward ticks per frame
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (ctl[0]) { clock[1] = 0; return; }             // paused by the embedding page: hold the frame
  if (ctl[1] > 0) {                                  // fast-forward: a burst of steps each frame, then play on
    for (let n = Math.min(ctl[1], ctl[2]); n > 0; n--, ctl[1]--) update();
    clock[1] = 0;
    render();
    return;
  }
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
// The amphora is drawn per pixel from tables baked at boot: its radius per row, a light level from the lamp, a fixed
// specular streak, and each pixel's angle round the axis. The frieze is one long strip of 14 painted panels; the
// vase turns by sliding an integer offset along it, and every pixel of the belly looks up the strip through asin().
const TWO_PI = Math.PI * 2, LOOP = 1680;
const SW = 1008, SH = 44, PW = 72, NPAN = 14, SC = 336; // 336 strip px make one turn: the vase turns 3 times a loop
const FT = 32, GY = 42;                  // the frieze's top row on screen; the ground line the figures stand on
const STRIP = new Uint8Array(SW * SH), MASK = new Uint32Array(SW * SH);
const C_CLAY = 0, C_BLK = 1, C_INC = 2, C_RED = 3, C_WHT = 4, C_GOLD = 5;
const SHC = Uint8Array.of(                // paint by light level: edge, shadow, mid, lit, highlight
  CLAY_0, CLAY_1, CLAY_2, CLAY_3, CLAY_4,
  GLZ_0, GLZ_0, GLZ_1, GLZ_1, GLZ_2,
  CLAY_0, CLAY_0, CLAY_1, CLAY_2, CLAY_3,
  RED_D, RED_D, RED_M, RED_L, RED_L,
  WHT_D, WHT_D, WHT_M, WHT_L, WHT_L,
  GOLD_D, GOLD_D, GOLD_M, GOLD_L, GOLD_L);
const B_GLAZE = 1, B_CLAY = 2, B_NECK = 3, B_TONGUE = 4, B_FRIEZE = 5, B_MEANDER = 6;
const VR = new Float32Array(H);
const VB = new Uint8Array(N), VL = new Uint8Array(N), VS = new Uint8Array(N); // band, light level, sheen (1 fringe, 2 core, 3 back rim)
const VPH = new Float32Array(N), VDS = new Int16Array(N);                   // angle from the front as a fraction of a turn, and in strip px
const VX0 = new Int16Array(H).fill(W), VX1 = new Int16Array(H).fill(-1);
const LIPR = Float32Array.of(17, 19.5, 20, 19.5, 17), LIPNY = Float32Array.of(-0.8, -0.4, 0, 0.4, 0.8);
const SHR = Float32Array.of(19, 28, 36, 42.5, 47.5, 51, 53);
const LOWR = Float32Array.of(50.3, 49.2, 47.6, 45.5, 42.8, 39.4, 35.2, 30, 24);
const HPX = Float32Array.of(-14, -21, -27, -32, -35, -36.5, -38), HPY = Float32Array.of(10, 8, 8.5, 12, 18, 24, 28); // left handle
const NKW = 88, NKH = 16, TGW = 384, MNW = 280;       // anthemion, tongues and meander: texels per turn
const TXN = new Uint8Array(NKW * NKH), TXT = new Uint8Array(TGW * 5), TXM = new Uint8Array(MNW * 5);
const MEANDER = ['######..', '#....#..', '#.##.#..', '#..#.#..', '####.###'];
const LX = -0.66, LY = -0.3, LZ = 0.69;                // toward the lamp
// The loop clock: state starts, and when each panel comes alive (it holds its first pose before, its last after)
const ST0 = new Uint16Array(16);
const AS = new Int16Array(NPAN), AL = new Int16Array(NPAN), PT = new Int16Array(NPAN), DRAWN = new Int16Array(NPAN).fill(-1);
const K_WRAP = 300;                     // a panel resets to its first pose this long before it comes alive, well out of view
let TT = 0, S0I = -12, S0Q = -12, LG = 0.25;

function ease(u) {
  return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, u)));
}
function mix(a, b, e) {
  return a + (b - a) * e;
}
function seg(t, a, b) {
  return Math.max(0, Math.min(1, (t - a) / (b - a)));
}
function dith(x, y, v) {
  return v * 16 > BAYER[(y & 3) * 4 + (x & 3)];
}

function vRad(y) {
  if (y >= 2 && y <= 6) return LIPR[y - 2];
  if (y >= 7 && y <= 24) return 13.5 + 1.8 * ((y - 15.5) / 8.5) ** 2;
  if (y >= 25 && y <= 31) return SHR[y - 25];
  if (y >= 32 && y <= 75) return 56 - 5.5 * ((y - 48) / 28) ** 2;
  if (y >= 76 && y <= 84) return LOWR[y - 76];
  return y === 85 ? 15 : y === 86 ? 20 : 0;
}
function bandOf(y) {
  if (y >= 8 && y <= 23) return B_NECK;
  if (y >= 25 && y <= 29) return B_TONGUE;
  if (y >= 32 && y <= 75) return B_FRIEZE;
  if (y >= 78 && y <= 82) return B_MEANDER;
  return y === 31 || y === 76 || y === 86 ? B_CLAY : B_GLAZE;
}
function lvlOf(d) {
  return d < 0.08 ? 0 : d < 0.34 ? 1 : d < 0.6 ? 2 : d < 0.84 ? 3 : 4;
}

function buildRoom() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (y >= 85) { bg[i] = y === 85 ? ROOM_C : (x + (y - 86) * 7) % 23 === 0 ? INK : STONE_D; continue; }
    const h = y / 85 * 3, band = h | 0, f = Math.min(1, Math.max(0, (h - band - 0.5) * 3 + 0.5));
    let c = Math.min(ROOM_C, ROOM_A + band + (f * 16 > BAYER[(y & 3) * 4 + (x & 3)] ? 1 : 0));
    if (y % 14 === 13 || (x + ((y / 14 | 0) & 1) * 13) % 26 === 0) c = Math.max(ROOM_A, c - 1); // faint ashlar courses
    bg[i] = c;
  }
  for (let y = 85; y < H; y++) for (let x = 0; x < 44; x++) { // the lamp's pool on the floor
    const d = Math.hypot((x - 13) * 0.6, (y - 86) * 1.6);
    if (d < 5 || (d < 9 && dith(x, y, (9 - d) / 4))) bg[y * W + x] = LIGHTEN[bg[y * W + x]];
  }
  // The lampstand: tripod feet, a bronze shaft with a knob, a dish and a black-glazed lamp
  line(bg, 10, 85, 6, 89, GOLD_D); line(bg, 11, 85, 15, 89, CLAY_0); line(bg, 10, 86, 10, 89, GOLD_D);
  for (let y = 40; y <= 86; y++) { plot(bg, 10, y, GOLD_D); plot(bg, 11, y, CLAY_0); }
  hline(bg, 9, 12, 62, GOLD_D); plot(bg, 12, 62, CLAY_0); hline(bg, 10, 11, 61, GOLD_M);
  hline(bg, 5, 15, 38, GOLD_D); hline(bg, 5, 9, 38, GOLD_M); hline(bg, 7, 13, 39, CLAY_0);
  hline(bg, 9, 12, 34, GLZ_2); hline(bg, 7, 14, 35, GLZ_1); hline(bg, 8, 10, 35, GLZ_3);
  hline(bg, 6, 16, 36, GLZ_1); plot(bg, 16, 35, GLZ_2); hline(bg, 7, 13, 37, GLZ_0);
  plot(bg, 5, 34, GLZ_1); plot(bg, 5, 35, GLZ_1); plot(bg, 6, 33, GLZ_1);
  // The plinth: a lit top edge, the front, a dark foot; the lamp side brighter
  for (let y = 87; y < H; y++) for (let x = 44; x <= 115; x++)
    bg[y * W + x] = y === 87 ? (x < 64 ? STONE_L : STONE_M) : x === 44 ? STONE_L : x === 115 ? STONE_D : y === 88 ? (x < 58 ? STONE_L : STONE_M) : STONE_D;
  hline(bg, 58, 101, 87, STONE_D);                       // the foot's contact shadow
}

function buildVase() {
  for (let y = 0; y < H; y++) VR[y] = vRad(y);
  for (let y = 2; y <= 86; y++) {
    const r = VR[y], dr = Math.max(-2.5, Math.min(2.5, (VR[Math.min(86, y + 1)] - VR[Math.max(2, y - 1)]) / 2));
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5 - CX) / r;
      if (Math.abs(u) >= 1) continue;
      const i = y * W + x;
      let nx = u, ny = y <= 6 ? LIPNY[y - 2] : -dr * 0.5, nz = Math.sqrt(1 - u * u);
      const n = Math.hypot(nx, ny, nz); nx /= n; ny /= n; nz /= n;
      const d = nx * LX + ny * LY + nz * LZ, sp = 2 * nz * d - LZ;
      VB[i] = bandOf(y); VL[i] = lvlOf(d);
      VS[i] = sp > 0.975 ? 2 : sp > 0.94 ? 1 : u > 0.93 ? 3 : 0;
      const ph = Math.asin(u);
      VPH[i] = ph / TWO_PI; VDS[i] = Math.round(ph * SC / TWO_PI);
    }
  }
  // Handles: a glazed tube from the neck out over the shoulder, shaded as a cylinder
  for (let y = 4; y <= 31; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (VB[i]) continue;
    const s = x + 0.5 < CX ? 1 : -1, px = (x + 0.5 - CX) * s, py = y + 0.5;
    let best = 9, qx = 0, qy = 0;
    for (let k = 0; k < HPX.length - 1; k++) {
      const ax = HPX[k], ay = HPY[k], bx = HPX[k + 1] - ax, by = HPY[k + 1] - ay;
      const t = Math.max(0, Math.min(1, ((px - ax) * bx + (py - ay) * by) / (bx * bx + by * by)));
      const dd = Math.hypot(px - ax - bx * t, py - ay - by * t);
      if (dd < best) { best = dd; qx = ax + bx * t; qy = ay + by * t; }
    }
    if (best > 1.7) continue;
    const nx = (px - qx) / (best || 1) * s * (best / 1.7), ny = (py - qy) / (best || 1) * (best / 1.7), nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
    const d = nx * LX + ny * LY + nz * LZ, sp = 2 * nz * d - LZ;
    VB[i] = B_GLAZE; VL[i] = lvlOf(d); VS[i] = sp > 0.96 ? 2 : sp > 0.9 ? 1 : 0;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (VB[i]) { VX0[y] = Math.min(VX0[y], x); VX1[y] = Math.max(VX1[y], x); continue; }
    if ((x > 0 && VB[i - 1]) || (x < W - 1 && VB[i + 1]) || (y > 0 && VB[i - W]) || (y < H - 1 && VB[i + W])) bg[i] = INK;
  }
}

function tset(tex, tw, th, u, v, c) {
  v = Math.round(v);
  if (v >= 0 && v < th) tex[v * tw + (((Math.round(u) % tw) + tw) % tw)] = c;
}
function buildTextures() {
  // Neck: upright palmettes over a red heart and pendant ones between, tied by one running tendril
  for (let u = 0; u < NKW; u++) tset(TXN, NKW, NKH, u, 7.5 - 3.5 * Math.cos(u * TWO_PI / 22), C_BLK);
  for (let k = 0; k < 8; k++) {
    const cu = k * 11, up = k & 1, by = up ? 12 : 3, dir = up ? -1 : 1;
    for (let j = -2; j <= 2; j++) { // five open petals, each ending in a round tip
      const a = j * 0.5, len = 7.6 - Math.abs(j) * 0.9;
      for (let s = 2; s <= len; s += 0.5) tset(TXN, NKW, NKH, cu + Math.sin(a) * s, by + dir * Math.cos(a) * s, C_BLK);
      tset(TXN, NKW, NKH, cu + Math.sin(a) * len + 1, by + dir * Math.cos(a) * len, C_BLK);
      tset(TXN, NKW, NKH, cu + Math.sin(a) * len, by + dir * (Math.cos(a) * len - 1), C_BLK);
    }
    for (let dx = -1; dx <= 1; dx++) tset(TXN, NKW, NKH, cu + dx, by, C_RED);
    tset(TXN, NKW, NKH, cu, by - dir, C_RED);
    tset(TXN, NKW, NKH, cu - 2, by - dir, C_BLK); tset(TXN, NKW, NKH, cu + 2, by - dir, C_BLK);
  }
  // Shoulder: tongues hanging from the neck, black and purple-red in turn
  for (let k = 0; k < 48; k++) for (let v = 0; v < 5; v++) for (let x = 0; x < 8; x++) {
    const on = v < 4 ? x >= 1 && x <= 6 : x >= 2 && x <= 5;
    TXT[v * TGW + k * 8 + x] = on ? (k & 1 ? C_RED : C_BLK) : C_CLAY;
  }
  for (let u = 0; u < MNW; u++) for (let v = 0; v < 5; v++) TXM[v * MNW + u] = MEANDER[v][u % 8] === '#' ? C_BLK : C_CLAY;
}

function buildBackground() {
  for (let k = 1; k < 16; k++) ST0[k] = ST0[k - 1] + DUR[k - 1];
  AS[0] = ST0[ORACLE]; AL[0] = 96;
  for (let p = 1; p < NPAN; p++) { AS[p] = ST0[p + 1] + 30; AL[p] = 72; }
  buildRoom();
  buildVase();
  buildTextures();
  buildTables();
}

// The whole amphora, every frame: bands looked up by angle, the frieze through the strip, then light and sheen.
function drawVase() {
  const dv = (1 - LG) * 8 / 3 - 0.2, rot = S0I / SC;
  for (let y = 2; y <= 86; y++) {
    const row = y * W;
    for (let x = VX0[y]; x <= VX1[y]; x++) {
      const i = row + x, band = VB[i];
      if (!band) continue;
      let code = C_BLK, plain = 1;
      if (band === B_CLAY) code = C_CLAY;
      else if (band === B_FRIEZE) { code = STRIP[(y - FT) * SW + ((S0I + VDS[i]) % SW + SW) % SW]; plain = 0; }
      else if (band === B_NECK) { const u = Math.floor((rot + VPH[i]) * NKW); code = TXN[(y - 8) * NKW + ((u % NKW) + NKW) % NKW]; plain = 0; }
      else if (band === B_TONGUE) { const u = Math.floor((rot + VPH[i]) * TGW); code = TXT[(y - 25) * TGW + ((u % TGW) + TGW) % TGW]; plain = 0; }
      else if (band === B_MEANDER) { const u = Math.floor((rot + VPH[i]) * MNW); code = TXM[(y - 78) * MNW + ((u % MNW) + MNW) % MNW]; plain = 0; }
      const off = Math.max(0, Math.min(2, Math.floor(dv + (x - 20) / 121 + (BAYER[(y & 3) * 4 + (x & 3)] - 7.5) / 120))); // light spreads from the lamp side
      let c = SHC[code * 5 + Math.max(0, VL[i] - off)];
      const s = VS[i];
      if (s && off === 0) {
        if (s === 3) { if (code === C_BLK) c = GLZ_2; }
        else if (code === C_BLK) c = s === 2 ? (plain ? GLZ_S : GLZ_3) : (plain ? GLZ_3 : GLZ_2);
        else if (s === 2) c = code === C_CLAY ? CLAY_4 : LIGHTEN[c];
      }
      buf[i] = c;
    }
  }
}
// Strip painting in the current panel's own px (0-71) and rows (0-43). Only the field between the border lines takes
// paint. A shape drawn between mark() and incise() gets a clay line scratched round it wherever it lies over black,
// which is how black-figure painters kept a limb readable across a body of the same glaze.
// A group (group() ... ungroup()) is a whole figure outlined the same way against the figures already there.
const MASK2 = new Uint32Array(SW * SH);
let OX = 0, CL = 3, CR = 68, MG = 0, GG = 0, gen = 0, mx0 = 0, my0 = 0, mx1 = 0, my1 = 0, gx0 = 0, gy0 = 0, gx1 = 0, gy1 = 0;
function sp(x, y, c) {
  if (x < CL || x > CR || y < 1 || y > GY) return;
  const i = y * SW + OX + x;
  STRIP[i] = c;
  if (MG) { MASK[i] = MG; if (x < mx0) mx0 = x; if (x > mx1) mx1 = x; if (y < my0) my0 = y; if (y > my1) my1 = y; }
  if (GG) { MASK2[i] = GG; if (x < gx0) gx0 = x; if (x > gx1) gx1 = x; if (y < gy0) gy0 = y; if (y > gy1) gy1 = y; }
}
function group() {
  GG = ++gen; gx0 = gy0 = 999; gx1 = gy1 = -999;
}
function ungroup(cut) { // cut: scratch the outline; either way the group's box stays in gx0..gy1 for dissolve()
  const g = GG;
  GG = 0;
  if (!cut) return;
  for (let y = Math.max(1, gy0 - 1); y <= Math.min(GY, gy1 + 1); y++)
    for (let x = Math.max(CL, gx0 - 1); x <= Math.min(CR, gx1 + 1); x++) {
      const i = y * SW + OX + x;
      if (MASK2[i] === g || STRIP[i] !== C_BLK) continue;
      if (MASK2[i - 1] === g || MASK2[i + 1] === g || MASK2[i - SW] === g || MASK2[i + SW] === g) STRIP[i] = C_INC;
    }
}
// Panels are designed at 5/6 scale and drawn zoomed about the ground under the panel's middle, so the figures fill
// the band; lines stay one pixel, fills and single design pixels cover their scaled cells.
const PZ = 1.2;
let Z = 1, ZX = 36;
function tx(x) {
  return ZX + (x - ZX) * Z;
}
function ty(y) {
  return GY - (GY - y) * Z;
}
function dX(x) { // a design point of the zoomed panel, in panel px
  return 36 + (x - 36) * PZ;
}
function dY(y) {
  return GY - (GY - y) * PZ;
}
function cells(x0, x1, y, c) {
  const a = Math.round(tx(x0 - 0.5)), b = Math.max(a, Math.round(tx(x1 + 0.5)) - 1);
  const r0 = Math.round(ty(y - 0.5)), r1 = Math.max(r0, Math.round(ty(y + 0.5)) - 1);
  for (let r = r0; r <= r1; r++) for (let x = a; x <= b; x++) sp(x, r, c);
}
function pp(x, y, c) {
  x = Math.round(x);
  cells(x, x, Math.round(y), c);
}
function sh(x0, x1, y, c) {
  cells(Math.round(x0), Math.round(x1), Math.round(y), c);
}
function sl(x0, y0, x1, y1, c) {
  x0 = tx(x0); y0 = ty(y0); x1 = tx(x1); y1 = ty(y1);
  const n = Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1;
  for (let s = 0; s <= n; s++) sp(Math.round(x0 + (x1 - x0) * s / n), Math.round(y0 + (y1 - y0) * s / n), c);
}
function inc(x, y) { // one incised pixel, only through black (real px)
  if (x >= CL && x <= CR && y >= 1 && y <= GY && STRIP[y * SW + OX + x] === C_BLK) STRIP[y * SW + OX + x] = C_INC;
}
function sdot(x, y) {
  inc(Math.round(tx(x)), Math.round(ty(y)));
}
function sinc(x0, y0, x1, y1) {
  x0 = tx(x0); y0 = ty(y0); x1 = tx(x1); y1 = ty(y1);
  const n = Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) || 1;
  for (let s = 0; s <= n; s++) inc(Math.round(x0 + (x1 - x0) * s / n), Math.round(y0 + (y1 - y0) * s / n));
}
function scap(x0, y0, r0, x1, y1, r1, c) {
  x0 = tx(x0); y0 = ty(y0); x1 = tx(x1); y1 = ty(y1); r0 *= Z; r1 *= Z;
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.max(r0, r1);
  for (let y = Math.floor(Math.min(y0, y1) - R); y <= Math.ceil(Math.max(y0, y1) + R); y++)
    for (let x = Math.floor(Math.min(x0, x1) - R); x <= Math.ceil(Math.max(x0, x1) + R); x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy <= r * r + 0.3) sp(x, y, c);
    }
}
function sell(cx, cy, rx, ry, c) {
  cx = tx(cx); cy = ty(cy); rx *= Z; ry *= Z;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const u = (x - cx) / rx, v = (y - cy) / ry;
      if (u * u + v * v <= 1.05) sp(x, y, c);
    }
}
function mark() {
  MG = ++gen; mx0 = my0 = 999; mx1 = my1 = -999;
}
function incise() {
  const g = MG;
  MG = 0;
  for (let y = Math.max(1, my0 - 1); y <= Math.min(GY, my1 + 1); y++)
    for (let x = Math.max(CL, mx0 - 1); x <= Math.min(CR, mx1 + 1); x++) {
      const i = y * SW + OX + x;
      if (MASK[i] === g || STRIP[i] !== C_BLK) continue;
      if (MASK[i - 1] === g || MASK[i + 1] === g || MASK[i - SW] === g || MASK[i + SW] === g) STRIP[i] = C_INC;
    }
}

// Figures. A pose is 7 points from the ground point under the hip, facing right, px up negative:
// hip, shoulder, head, near hand, far hand, near foot, far foot, then the elbow bends (near, far).
const K_STAND = 0, K_WALKA = 1, K_WALKB = 2, K_KNEEL = 3, K_KNEELUP = 4, K_LUNGE = 5, K_CLUBUP = 6, K_CLUBDN = 7,
  K_ARMSUP = 8, K_CARRY = 9, K_DIG = 10, K_RATTLE = 11, K_BOW = 12, K_REACH = 13, K_PULL = 14, K_LIE = 15, K_RUN = 16, K_RAISE = 17;
const KP = Float32Array.of(
  0, -13, 0.5, -21.5, 1, -25, 3, -13.5, -2, -14, 2.5, 0, -2.5, 0, 1, 1,
  0, -12.5, 1, -21, 1.8, -24.5, 4, -14, -3.5, -13.5, 5, 0, -4.5, 0, 1, 1,
  0, -12.5, 1, -21, 1.8, -24.5, -2.5, -13.5, 4, -14, -4.5, 0, 5, 0, 1, 1,
  -1, -8, 0.5, -16.5, 2.5, -19, 4.5, -8.5, -1, -9, 4.5, 0, -6, -0.5, 1, 1,
  -1, -8, 0, -16.5, 1, -20, 4.5, -8.5, -1, -9, 4.5, 0, -6, -0.5, 1, 1,
  -1, -11, 4, -18.5, 6.5, -20.5, 9, -18, 8, -16, 6, 0, -7, 0, 1, 1,
  0, -13, -0.5, -21.5, 0.5, -25, -3, -29, 4, -17, 5, 0, -4, 0, -1, 1,
  0.5, -12.5, 2.5, -20.5, 3.5, -24, 9, -15, 6, -15, 5.5, 0, -4, 0, 1, 1,
  0, -12.5, 0, -21, 1.5, -23.8, 3.5, -29.5, -3, -29.5, 3.5, 0, -3.5, 0, -1, 1,

  const f = hsh(TT >> 2), h = LG > 0.6 ? 3 + (f & 1) : 2, sw = (f >> 3) % 3 - 1;
  plot(buf, FLX - 1, 34, GOLD_D); plot(buf, FLX + 1, 34, GOLD_D); plot(buf, FLX, 34, GOLD_L);
  plot(buf, FLX, 33, FLAME); plot(buf, FLX + ((f >> 5) & 1 ? 1 : -1), 33, GOLD_M);

// Loop clock: the turn, the lamp, and each panel's own time, frozen on pose frames
function sample() {
  snap.set(pose);
  for (let p = 0; p < NPAN; p++) {
    let u = (TT - AS[p] + K_WRAP) % LOOP;
    if (u < 0) u += LOOP;
    u -= K_WRAP;
    PT[p] = u < 0 ? 0 : u > AL[p] ? AL[p] : u;
  }
  S0Q = S0I;
  srcX = FLX; srcY = FLY; rim = 3;
}
function step() {
  const t = stT;
  TT = ST0[state] + t;
  let s = 36;
  if (state === VASE) s = -12 + 48 * ease(t / 90);
  else if (state === RETURN) s = 972 + 24 * ease(t / 84);
  else if (state > ORACLE) s = 36 + 72 * (state - 2) + 72 * ease(t / 30);
  S0I = Math.round(s);
  LG = state === VASE ? 0.25 + 0.75 * ease(t / 66) : state === RETURN ? 1 - 0.75 * ease((t - 12) / 66) : 1;
  if (tick % POSE_STEP === 0) sample();
  if (state === HYDRA) for (let k = 5; k < 9; k++) if (t - 30 === HCUT[k]) { // a spilled head lopped off: its blood on the glaze
    neckAt(k, HCUT[k] - 6, 1);
    const x = scrX(HYDRA - 1, dX(gX), S0I, FT), y = FT + dY(gY);
    for (let j = 0; j < 12; j++) spawn(BURST, 14 + rand() * 16, x, y, (rand() - 0.5) * 1.6, -rand() * 1.2, R_BLOOD);
  }
  if (state === STABLES) for (let k = 0; k < 3; k++) if (t >= 80 + 3 * k && t < 100 && t % 3 === k) {
    const x = scrX(STABLES - 1, dX(SPX[k]), (STABLES - 1) * PW + 36, 75);
    spawn(BURST, 10 + rand() * 10, x + rand() * 2, 86, (rand() - 0.5) * 1.2, -0.5 - rand() * 0.6, R_WATER);
  }
  if (state === BIRDS || state === BULL) for (let k = 0; k < 6; k += 2) if (TT === ST0[BIRDS] + 30 + BSHOT[k] + 6) {
    birdAt(k, BSHOT[k] + 6 - BTE[k]);
    for (let j = 0; j < 14; j++) spawn(BURST, 16 + rand() * 20, gX, gY, (rand() - 0.5) * 1.8, (rand() - 0.7) * 1.4, R_FEATHER);
  }
  if ((state === HYDRA && t === 102) || (state === BULL && t === 72)) shakeT = 6; // the rock lands; the bull drops to its knees
  if (state === CATTLE && t === 54) shakeT = 4;
  if (state === OLYMPUS && t === 78) flashT = 3;
  if (state === OLYMPUS && t >= 34 && t < 84 && t % 2 === 0)
    spawn(MOTE, 30 + rand() * 40, 52 + rand() * 18, 31, 0, -0.3 - rand() * 0.4, R_EMBER);
  if (state === OLYMPUS && t >= 78 && t < 102 && t % 2 === 1) {
    const k = rand() * NSTAR | 0;
    starOrigin(k);
    spawn(TRAIL, 10 + rand() * 12, gX + (rand() - 0.5) * 6, gY - rand() * 10, (rand() - 0.3) * 0.6, -0.4 - rand() * 0.5, R_STAR);
  }
  for (let i = 0; i < MAXP; i++) if (pKind[i] && (px[i] < -4 || px[i] > W + 4 || py[i] > FY - 0.5 && pvy[i] >= 0 && pRamp[i] !== R_WATER)) pKind[i] = 0;
}

function drawActor() { // the Hydra's new heads, climbing past the frieze border onto the shoulder of the vase
  const t = PT[HYDRA - 1];
  if (state !== HYDRA || t <= 0 || t >= AL[HYDRA - 1]) return;
  for (let k = 5; k < 9; k++) {
    if (t < HBORN[k] || t >= HCUT[k]) continue;
    let x0 = 0, y0 = 0, on = 0;
    for (let j = 0; j <= 28; j++) {
      neckAt(k, t, j / 28);
      if (gY > 0.5) continue;
      const x = scrX(HYDRA - 1, dX(gX), S0Q, FT), y = FT + dY(gY);
      if (on) capsule(spr, x0, y0, 1.1, x, y, 1.1, GLZ_0, GLZ_1, GLZ_2);
      x0 = x; y0 = y; on = 1;
    }
    if (!on) continue;
    const hx = Math.round(x0), hy = Math.round(y0), d = HNX[k] < HNB[k] + 3 ? -1 : 1;
    hline(spr, hx - 2, hx + 2, hy, GLZ_1); hline(spr, hx - 1, hx + 2, hy - 1, GLZ_2); hline(spr, hx - 1, hx + 1, hy + 1, GLZ_1);
    plot(spr, hx + d * 3, hy, GLZ_1); plot(spr, hx + d * 4, hy, GLZ_1); plot(spr, hx + d, hy - 1, WHT_L);
    if ((t / 6 + k) & 1) { hline(spr, Math.min(hx, hx + d * 3), Math.max(hx, hx + d * 3), hy + 2, GLZ_1); plot(spr, hx + d * 2, hy + 1, RED_L); plot(spr, hx + d * 5, hy + 1, RED_L); plot(spr, hx + d * 6, hy + 2, RED_L); }
  }
}
function drawUnder() {
  halo(FLX, FLY, 8 + LG * 16 + (hsh(TT >> 3) & 1), ROOM_E, ROOM_D);
  updateStrip();
  drawVase();

}

}

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
  // Same-origin pages drive the loop through iframe.contentWindow.pixelAnims: pause() holds the frame, play() resumes,
  // and seek(t, rate) runs `rate` steps a frame forward to tick t of the loop (wrapping), then plays on.
  const loop = DUR.reduce((a, b) => a + b, 0);
  window.pixelAnims = Object.freeze({
    get tick() { return tick; }, loop,
    get paused() { return ctl[0] === 1; }, get seeking() { return ctl[1] > 0; },
    pause() { ctl[0] = 1; }, play() { ctl[0] = 0; },
    seek(t, rate = 10) { ctl[1] = ((t - tick) % loop + loop) % loop; ctl[2] = Math.min(loop, Math.max(1, Math.floor(rate) || 1)); ctl[0] = 0; },
  });
}
