<title>Forge Blacksmith</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #0e0908; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0e0908; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
<canvas id="view" role="img" aria-label="Pixel art blacksmith hammering glowing steel on an anvil and quenching it in a water barrel"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 128, H = 96;             // logical resolution
const FLOOR = 74, FY = FLOOR - 1;  // forge floor line; feet row and particle floor
const POSE_STEP = 6;               // 10 fps pose frames
const AX = 32;                     // smith feet x
const WATER_Y = 76;                // quench barrel water surface (the barrel stands in the foreground)

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#0e0908',
  '#1e1411', '#2e201a', '#45302a',
  '#4a2218', '#6e3424',
  '#7a1d10', '#c23d17', '#f07a22', '#ffc043', '#fff2a8', '#ffffff',
  '#2a2b33', '#4c4e5c', '#7e8294',
  '#4a2e1a', '#7e5430',
  '#16303a', '#2a5563', '#5d8c98',
  '#9c5a3c', '#d8936a', '#2a1a14',
  '#34405a', '#4e6080', '#7488a8',
  '#3e2616', '#62401f',
  '#6c6a70', '#b8b4b0',
];
const INK = 0, WALL_D = 1, WALL_M = 2, WALL_L = 3, BRICK_D = 4, BRICK_M = 5,
  HOT_D = 6, HOT_M = 7, HOT_L = 8, EMB_L = 9, YEL_H = 10, WHITE = 11,
  MET_D = 12, MET_M = 13, MET_L = 14, WOOD_D = 15, WOOD_L = 16, WAT_D = 17, WAT_M = 18, WAT_L = 19,
  SKIN_D = 20, SKIN_L = 21, HAIR = 22, SHIRT_D = 23, SHIRT_M = 24, SHIRT_L = 25, APRON_D = 26, APRON_M = 27,
  STEAM_D = 28, STEAM_L = 29;

// One step brighter per ramp; walls and bricks warm toward the fire in the flash.
const LIGHTEN = Uint8Array.of(
  WALL_D,
  WALL_M, WALL_L, WOOD_L,
  BRICK_M, WOOD_L,
  HOT_M, HOT_L, EMB_L, YEL_H, WHITE, WHITE,
  MET_M, MET_L, STEAM_L,
  WOOD_L, EMB_L,
  WAT_M, WAT_L, STEAM_L,
  SKIN_L, EMB_L, WOOD_D,
  SHIRT_M, SHIRT_L, STEAM_L,
  APRON_M, WOOD_L,
  STEAM_L, WHITE);
const RAMP_HOT = Uint8Array.of(WHITE, YEL_H, EMB_L, HOT_L, HOT_M, HOT_D);
const RAMP_EMBER = Uint8Array.of(EMB_L, HOT_L, HOT_M, HOT_D);
const RAMP_WATER = Uint8Array.of(WAT_L, WAT_M, WAT_D, WAT_D);
const RAMPS = [RAMP_HOT, RAMP_EMBER, RAMP_WATER];
const RIM = Uint8Array.of(HOT_L, EMB_L, YEL_H); // firelight off the hot steel
const RIM_BANDS = Uint16Array.of(10, 18, 28);
const LIGHT = Float32Array.of(0.8, -0.6);       // the forge fire, up and to the right
const RIM_OK = new Uint8Array(PAL.length).fill(1);
for (const c of [MET_D, MET_M, MET_L, WOOD_D, WOOD_L, HOT_D, HOT_M, HOT_L, EMB_L, YEL_H, WHITE]) RIM_OK[c] = 0; // tools and hot steel
const AIR = new Uint8Array(PAL.length);         // no open air indoors; glows use lighten() instead

// [left, right] x-offsets per shirt row, shoulders to hips
const TORSO = Int8Array.of(-3, 3, -4, 3, -4, 4, -4, 4, -4, 4, -3, 4, -3, 4, -3, 3, -3, 3, -3, 3, -3, 3);
// Head facing right, 7x8: h hair, B beard light, s/d skin, e eye
const HEAD = ['..hhh..', '.hhhhh.', 'hhhsss.', 'hhhses.', 'hhhsssd', 'hBBhhss', '.hBhhh.', '..hhh..'];
const HEAT = Uint8Array.of(MET_M, HOT_D, HOT_M, HOT_L, EMB_L, YEL_H, WHITE); // billet colour per heat level

const IDLE = 0, RAISE = 1, STRIKE = 2, QUENCH = 3, RECOVER = 4;
const DUR = Uint16Array.of(120, 78, 42, 84, 108); // L = 432
const EASE = Uint16Array.of(6, 48, 6, 36, 84);
const EASE_OUT = Uint8Array.of(0, 0, 1, 0, 0);
const FIRE_T = 6, QUENCH_T = 24;
const CROUCH = 0, LEAN = 1, HHX = 2, HHY = 3, HA = 4, TX = 5, TY = 6, TA = 7, NP = 8;
const REST = Float32Array.of(0, 1, 3, 10, 1.75, 30, -23, 0.05); // tongs in the coals, hammer head resting on the floor
const TARGET = [
  REST,
  Float32Array.of(-1, -1, -3, -9, -2.3, 23, -12, 0.3),   // steel laid on the anvil, hammer raised overhead
  Float32Array.of(1, 2, 11, 2, 0.37, 23, -12, 0.3),      // hammer driven down onto the steel
  Float32Array.of(2, 2, 3, 10, 1.75, 14, 3, 1.25),       // steel plunged into the barrel, hammer lowered
  REST,
];
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
const TONG_LEN = 17, HAMMER_LEN = 11, BARREL_X = 46;
const fg = new Uint8Array(N).fill(EMPTY); // foreground quench barrel, stamped over the actor
const headMap = new Uint8Array(56);
let coalI = null;                          // coal-bed pixel indices for the flicker
const NS = 36;                             // steam puff pool
const smX = new Float32Array(NS), smY = new Float32Array(NS), smVX = new Float32Array(NS), smVY = new Float32Array(NS);
const smR = new Float32Array(NS), smG = new Float32Array(NS), smAge = new Uint8Array(NS), smLife = new Uint8Array(NS);
let smCur = 0, qHeat = 5;
let hipY = 0, cx = 0, chestY = 0, nsX = 0, nsY = 0, fsX = 0, fsY = 0, hhX = 0, hhY = 0, hdX = 0, hdY = 0;
let hpX = 0, hpY = 0, tipX = 0, tipY = 0, handX = 0, handY = 0, bilX = 0, bilY = 0, hx = 0, hy = 0;

function hash(n) {
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  return (n ^ (n >>> 16)) >>> 0;
}

function buildBackground() {
  const dith = (x, y, v) => v * 16 > BAYER[(y & 3) * 4 + (x & 3)];
  // Stone block wall under a timber beam.
  for (let y = 0; y < FLOOR; y++) {
    const course = y >> 3, ry = y & 7;
    for (let x = 0; x < W; x++) {
      const bx = (x + (course & 1) * 6) % 12;
      bg[y * W + x] = ry === 7 || bx === 0 ? WALL_D : ry === 0 ? WALL_L : WALL_M;
    }
  }
  for (let x = 0; x < W; x++) { plot(bg, x, 5, WOOD_L); for (let y = 6; y < 9; y++) plot(bg, x, y, WOOD_D); }
  for (const [x, y] of [[8, 20], [17, 23]]) { // horseshoes on pegs
    plot(bg, x + 2, y - 2, MET_M);
    for (let d = 0; d < 5; d++) { plot(bg, x, y + d, MET_D); plot(bg, x + 4, y + d, MET_D); }
    hline(bg, x + 1, x + 3, y + 5, MET_D); hline(bg, x, x + 4, y - 1, MET_M);
  }
  // Small window, top right: cool dawn light against the fire.
  rect(bg, 102, 14, 16, 16, WOOD_D);
  rect(bg, 104, 16, 12, 12, WAT_M);
  rect(bg, 104, 16, 12, 5, WAT_L);
  hline(bg, 104, 115, 21, WOOD_D); for (let y = 16; y < 28; y++) plot(bg, 109, y, WOOD_D);

  // Forge: brick hood and chimney, the hearth box, and its coal bed.
  for (let y = 0; y < 44; y++) {
    const inset = y < 30 ? 6 : Math.round((44 - y) * 0.4);
    for (let x = 56 + inset; x <= 88 - inset; x++) {
      const course = y >> 2, bx = (x + (course & 1) * 3) % 6;
      plot(bg, x, y, (y & 3) === 3 || bx === 0 ? BRICK_D : BRICK_M);
    }
  }
  const coal = [];
  for (let y = 44; y < FLOOR; y++) {
    for (let x = 52; x <= 92; x++) {
      const course = y >> 2, bx = (x + (course & 1) * 3) % 6;
      let c = (y & 3) === 3 || bx === 0 ? BRICK_D : BRICK_M;
      if (y === 44) c = WOOD_L;                     // worn hearth lip catching the glow
      else if (y < 52 && x > 55 && x < 89) { c = (x * 5 + y * 3) % 7 < 2 ? HOT_M : (x + y) % 3 ? HOT_D : INK; coal.push(y * W + x); }
      plot(bg, x, y, c);
    }
  }
  coalI = Int32Array.from(coal);

  // Floor: packed earth with ash, lit near the hearth.
  for (let y = FLOOR; y < H; y++) {
    for (let x = 0; x < W; x++) bg[y * W + x] = y === FLOOR ? WALL_L : (x * 7 + y * 5) % 23 === 0 ? STEAM_D : (x * 3 + y * 11) % 13 === 0 ? WALL_M : WALL_D;
  }
  // Firelight: one shade warmer around the hearth, a dithered fringe, never a doubled hot core.
  const coalSet = new Set(coal);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - 72, (y - 50) * 1.3), i = y * W + x;
      if (coalSet.has(i) || d > 21) continue;
      if (d < 17 || dith(x, y, 0.5)) bg[i] = LIGHTEN[bg[i]];
    }
  }

  // Anvil on a stump, horn to the right, in front of the hearth.
  for (let y = 70; y < FLOOR + 1; y++) for (let x = 51; x <= 63; x++) plot(bg, x, y, x === 51 || (x - 51) % 5 === 3 ? WOOD_D : WOOD_L);
  hline(bg, 50, 64, 69, MET_M); hline(bg, 49, 65, 70, MET_D);
  for (let y = 66; y < 69; y++) hline(bg, 53, 61, y, y === 66 ? MET_M : MET_D);
  hline(bg, 46, 66, 63, MET_L);
  hline(bg, 47, 66, 64, MET_M); hline(bg, 48, 66, 65, MET_D);
  hline(bg, 67, 70, 63, MET_L); hline(bg, 67, 69, 64, MET_M); plot(bg, 71, 63, MET_M); // horn
  hline(bg, 22, 42, FLOOR, WALL_M); // contact shadow

  // Foreground barrel: bulging staves with iron hoops, then the rim and the water surface on top.
  for (let y = WATER_Y; y < H; y++) {
    const rx = 10 + Math.round(Math.sin(Math.min(1, (y - WATER_Y) / 19) * Math.PI) * 1.2);
    for (let x = BARREL_X - rx; x <= BARREL_X + rx; x++) {
      let c = (x - BARREL_X + 12) % 4 === 0 ? WOOD_D : x < BARREL_X - 4 ? WOOD_D : WOOD_L;
      if (y === 81 || y === 90) c = MET_D;
      else if (y === 80 || y === 89) c = MET_M;
      fg[y * W + x] = c;
    }
  }
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -11; dx <= 11; dx++) {
      const x = BARREL_X + dx, y = WATER_Y + dy;
      const rim = (dx * dx) / 110 + (dy * dy) / 9, water = (dx * dx) / 81 + (dy * dy) / 4;
      if (water <= 1) fg[y * W + x] = dy < -1 ? WAT_D : dy === -1 && dx > 0 ? WAT_L : WAT_M;
      else if (rim <= 1) fg[y * W + x] = dy < 0 ? WOOD_L : WOOD_D;
    }
  }

  const HMAP = { '.': EMPTY, h: HAIR, B: WOOD_D, s: SKIN_L, d: SKIN_D, e: INK };
  HEAD.forEach((row, y) => { for (let x = 0; x < 7; x++) headMap[y * 7 + x] = HMAP[row[x]]; });
}

// Freeze the smooth pose onto the pixel grid; the sprite only changes on these frames.
function sample() {
  snap.set(pose);
  cx = AX + Math.round(pose[LEAN]);
  hipY = FY - 12 + Math.round(pose[CROUCH]); // legs nearly straight at rest
  chestY = hipY - 11;
  nsX = cx + 2; nsY = chestY + 2; fsX = cx - 1; fsY = chestY + 2;
  const ha = pose[HA];
  hhX = nsX + Math.round(pose[HHX]); hhY = nsY + Math.round(pose[HHY]);
  hdX = Math.round(hhX + Math.cos(ha) * HAMMER_LEN); hdY = Math.round(hhY + Math.sin(ha) * HAMMER_LEN);
  hpX = -Math.sin(ha); hpY = Math.cos(ha); // across the handle, for the hammer head
  // Tongs: the tip is placed in the world (coals, anvil, barrel); the hand sits behind it along the tongs.
  const ta = pose[TA], dx = Math.cos(ta), dy = Math.sin(ta);
  tipX = AX + Math.round(pose[TX]); tipY = FY + Math.round(pose[TY]);
  handX = Math.round(tipX - dx * TONG_LEN); handY = Math.round(tipY - dy * TONG_LEN);
  bilX = Math.round(tipX + dx * 6); bilY = Math.round(tipY + dy * 6);
  hx = cx - 3; hy = chestY - 8;

  // Heat of the billet: hot from the coals, white at the strike, dead in the water, glowing again in the coals.
  if (state === IDLE || state === RAISE) qHeat = 5;
  else if (state === STRIKE) qHeat = stT >= FIRE_T && stT < FIRE_T + 6 ? 6 : 5;
  else if (state === QUENCH) qHeat = stT < 12 ? 5 : stT < QUENCH_T ? 4 : Math.max(0, 4 - ((stT - QUENCH_T) / 8 | 0));
  else qHeat = stT < 70 ? 0 : Math.min(5, (stT - 70) / 7 | 0);
  srcX = (tipX + bilX) >> 1; srcY = (tipY + bilY) >> 1;
  rim = qHeat >= 6 ? 4 : qHeat >= 5 ? 3 : qHeat >= 3 ? 2 : 1;
}

function step() {
  if (tick % POSE_STEP === 0) sample();
  if (stT % 14 === 7) spawn(MOTE, 50 + rand() * 40, 58 + rand() * 26, 44, 0, -0.25 - rand() * 0.2, 1); // embers
  if (state === STRIKE && stT === FIRE_T) strike();
  if (state === QUENCH && stT === QUENCH_T) quench();
  if (state === QUENCH && stT > QUENCH_T && stT < QUENCH_T + 44 && stT % 5 === 0)
    puff(tipX + 2 + rand() * 6, WATER_Y - 2, 0.1 + rand() * 0.2, -0.45 - rand() * 0.2, 1, 0.045, 36 + rand() * 18 | 0);
  for (let i = 0; i < NS; i++) {
    if (smAge[i] >= smLife[i]) continue;
    smAge[i]++;
    smVX[i] *= 0.95; smVY[i] = smVY[i] * 0.96 - 0.01; // steam keeps rising
    smX[i] += smVX[i]; smY[i] += smVY[i];
  }
}
function strike() {
  shakeT = 8; flashT = 2;
  const sx = (tipX + bilX) >> 1, sy = Math.min(tipY, bilY) - 1;
  for (let n = 0; n < 30; n++) { // sparks fly up off the anvil
    const a = -Math.PI * (0.05 + rand() * 0.9), v = 0.8 + rand() * 2.6;
    spawn(BURST, 12 + rand() * 26, sx, sy, Math.cos(a) * v, Math.sin(a) * v, 0);
  }
}
function quench() {
  for (let n = 0; n < 10; n++)
    spawn(BURST, 14 + rand() * 12, tipX + (rand() - 0.5) * 8, WATER_Y - 1, (rand() - 0.5) * 1.6, -1 - rand() * 1.4, 2);
  for (let n = 0; n < 6; n++)
    puff(tipX + rand() * 10, WATER_Y - 2, 0.1 + rand() * 0.4, -0.6 - rand() * 0.4, 1.5 + rand(), 0.05, 44 + rand() * 24 | 0);
}
function puff(x, y, vx, vy, r, grow, life) {
  const i = smCur;
  smCur = (smCur + 1) % NS;
  smX[i] = x; smY[i] = y; smVX[i] = vx; smVY[i] = vy; smR[i] = r; smG[i] = grow; smAge[i] = 0; smLife[i] = life;
}

// Ink a band around a segment, only where it crosses sprite pixels already drawn.
function inkEdge(x0, y0, x1, y1, r) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(r);
  for (let y = Math.min(y0, y1) - R; y <= Math.max(y0, y1) + R; y++) {
    for (let x = Math.min(x0, x1) - R; x <= Math.max(x0, x1) + R; x++) {
      if (x < 0 || x >= W || y < 0 || y >= H || spr[y * W + x] === EMPTY) continue;
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u;
      if (qx * qx + qy * qy <= r * r) spr[y * W + x] = INK;
    }
  }
}
// Arm: shirt sleeve to the elbow, bare forearm to the fist.
function arm(sx, sy, hx0, hy0, side, near) {
  joint(sx, sy, hx0, hy0, 7, 7, side);
  const ex = jx, ey = jy;
  if (near) { inkEdge(sx, sy, ex, ey, 2.6); inkEdge(ex, ey, hx0, hy0, 2.3); }
  capsule(spr, sx, sy, 1.7, ex, ey, 1.4, SHIRT_D, near ? SHIRT_M : SHIRT_D, near ? SHIRT_L : SHIRT_M);
  capsule(spr, ex, ey, 1.4, hx0, hy0, 1.2, SKIN_D, near ? SKIN_L : SKIN_D, SKIN_L);
  rect(spr, hx0 - 1, hy0 - 1, 2, 2, near ? SKIN_L : SKIN_D);
}
function leg(x0, fx, near) {
  joint(x0, hipY, fx, FY - 2, 6, 6, -1);
  capsule(spr, x0, hipY, 1.8, jx, jy, 1.5, HAIR, APRON_D, near ? WOOD_D : APRON_D);
  capsule(spr, jx, jy, 1.5, fx, FY - 2, 1.3, HAIR, APRON_D, near ? WOOD_D : APRON_D);
  hline(spr, fx - 1, fx + 2, FY, HAIR); // boot
  hline(spr, fx - 1, fx + 1, FY - 1, near ? WALL_L : WALL_M);
}

function drawActor() {
  arm(fsX, fsY, handX, handY, 1, 0); // tongs arm, far side
  leg(cx - 2, AX - 4, 0);
  leg(cx + 1, AX + 5, 1);

  const lean = cx - AX;
  for (let i = 0; i < 11; i++) {
    const c0 = AX + Math.round(lean * (1 - i / 10)), y = chestY + i;
    const l = c0 + TORSO[i * 2], r = c0 + TORSO[i * 2 + 1];
    for (let x = l; x <= r; x++) {
      let c = x === l ? SHIRT_D : x >= r - 1 ? SHIRT_L : SHIRT_M;
      if (i >= 3 && x >= c0) c = x === c0 ? APRON_D : APRON_M;          // leather apron over the front
      if (i < 3 && x === c0 - 1 + i) c = APRON_D;                        // apron strap over the shoulder
      plot(spr, x, y, c);
    }
  }
  for (let y = hipY + 1; y < hipY + 7; y++) hline(spr, AX, AX + 4, y, y === hipY + 6 ? APRON_D : APRON_M); // apron skirt

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 7; c++) {
      const v = headMap[r * 7 + c];
      if (v !== EMPTY) plot(spr, hx + c, hy + r, v);
    }
  }

  // Tongs and the billet at their tip, coloured by its heat.
  line2(spr, handX, handY, tipX, tipY, MET_M, MET_D);
  line2(spr, tipX, tipY, bilX, bilY, HEAT[qHeat], HEAT[Math.max(0, qHeat - 1)]);

  arm(nsX, nsY, hhX, hhY, 1, 1); // hammer arm, near side
  line2(spr, hhX, hhY, hdX, hdY, WOOD_L, WOOD_D);
  capsule(spr, hdX - hpX * 2, hdY - hpY * 2, 1.5, hdX + hpX * 2, hdY + hpY * 2, 1.5, MET_D, MET_M, MET_L);
  rect(spr, hhX - 1, hhY - 1, 2, 2, SKIN_L); // fist over the handle
}

function blob(cx0, cy0, r, c, thr) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++) {
    const y = cy0 + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -k; dx <= k; dx++) {
      const x = cx0 + dx;
      if (x < 0 || x >= W || dx * dx + dy * dy > r * r || BAYER[(y & 3) * 4 + (x & 3)] >= thr) continue;
      buf[y * W + x] = c;
    }
  }
}
// Steam as one merged cloud: every puff's rim, then the bodies, then bright tops; dithered away with age.
function drawSteam() {
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < NS; i++) {
      const age = smAge[i], life = smLife[i];
      if (age >= life) continue;
      const u = age / life, r = smR[i] + age * smG[i], thr = u < 0.5 ? 16 : Math.round((1 - u) / 0.5 * 16);
      const x = Math.round(smX[i]), y = Math.round(smY[i]);
      if (pass === 0) blob(x, y, r, STEAM_D, thr);
      else if (pass === 1 && r >= 2) blob(x, y, r - 1, u < 0.4 ? STEAM_L : STEAM_D, thr);
      else if (pass === 2 && r > 2 && u < 0.4) blob(x, y - 1, r * 0.45, WHITE, thr);
    }
  }
}

function drawUnder() {
  for (let k = 0; k < coalI.length; k++) { // coals breathe and flicker
    const h = hash(coalI[k] * 7 + (tick % 432 / 6 | 0)) & 15;
    if (h < 3) buf[coalI[k]] = h === 0 ? EMB_L : HOT_L;
  }
  for (let k = 0; k < 7; k++) { // flame tongues licking up from the coals
    const x = 58 + k * 4, h = 2 + hash(k * 131 + (tick % 432 / 5 | 0)) % 4;
    for (let d = 0; d < h; d++) plot(buf, x, 43 - d, d === 0 ? EMB_L : d < h - 1 ? HOT_L : HOT_M);
  }
  if (qHeat >= 4) lighten(srcX, srcY, 4 + qHeat);
}
function drawOver() {
  drawParticles(true);
  for (let y = WATER_Y - 3; y < H; y++) { // foreground barrel covers the legs and whatever is under the water
    for (let x = BARREL_X - 12; x <= BARREL_X + 12; x++) {
      const i = y * W + x;
      if (fg[i] !== EMPTY) buf[i] = fg[i];
    }
  }
  if (state === QUENCH && stT >= QUENCH_T && stT < QUENCH_T + 40) { // ripples on the water
    const rx = Math.min(8, 2 + (stT - QUENCH_T) * 0.25);
    for (let s = 0; s < 32; s++) {
      const a = s / 32 * 6.2832, x = Math.round(tipX + Math.cos(a) * rx), y = Math.round(WATER_Y + Math.sin(a) * rx * 0.25);
      const f = fg[y * W + x];
      if (f === WAT_M || f === WAT_D || f === WAT_L) buf[y * W + x] = WAT_L;
    }
  }
  drawSteam();
  if (state === STRIKE && stT >= FIRE_T && stT < FIRE_T + 10) { // glint where the hammer lands
    const f = stT - FIRE_T, x = (tipX + bilX) >> 1, y = Math.min(tipY, bilY) - 1;
    for (let d = 1; d <= 5 - (f >> 1); d++) { plot(buf, x + d, y, YEL_H); plot(buf, x - d, y, YEL_H); plot(buf, x, y - d, YEL_H); }
    plot(buf, x, y, WHITE);
  }
}
// #endregion

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
}
// #endregion
})();
</script>
