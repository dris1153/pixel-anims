<title>Vampire Bat Cloak</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #0a0610; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0610; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;

<canvas id="view" role="img" aria-label="Pixel art vampire lord on a gothic castle balcony under a full moon; he spreads his cape, it bursts into a swarm of bats that circles the moon, the bats stream back and knit into the cape, and he straightens his collar"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 128, H = 96;             // logical resolution
const FY = 86;                     // embers settle on the balcony floor
const POSE_STEP = 6;               // 10 fps pose frames
const AX = 40;                     // the vampire, facing the moon on the right
const MX = 92, MY = 28, MR = 12;   // full moon
const NB = 24;                     // bats the cape becomes

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#0a0610',
  '#141030', '#221a46', '#33265e', '#4a3676',
  '#f4f0d8', '#c8c2a8', '#8e8a96',
  '#6a5494',
  '#100a1c', '#1e1630',
  '#f0b040',
  '#302a40', '#524a66', '#80789a',
  '#120a18', '#281a34', '#44305a',
  '#5a0c1c', '#a81a2e', '#e0404c',
  '#7e7c9c', '#c4c2d8',
  '#dcd6e6', '#ffffff',
];
const INK = 0, SKY0 = 1, SKY1 = 2, SKY2 = 3, SKY3 = 4, MOON_L = 5, MOON_M = 6, MOON_D = 7, GLOW = 8,
  CAS_D = 9, CAS_M = 10, WIN = 11, STONE_D = 12, STONE_M = 13, STONE_L = 14,
  CAPE_D = 15, CAPE_M = 16, CAPE_L = 17, LINE_D = 18, LINE_M = 19, LINE_L = 20,
  SKIN_D = 21, SKIN_L = 22, SHIRT = 23, WHITE = 24;

// One step brighter per ramp; the moon maps to itself so nothing bleaches it.
const LIGHTEN = Uint8Array.of(
  CAPE_D,
  SKY1, SKY2, SKY3, GLOW,
  MOON_L, MOON_L, MOON_M,
  MOON_D,
  CAS_M, STONE_D,
  WIN,
  STONE_M, STONE_L, MOON_M,
  CAPE_M, CAPE_L, CAPE_L,
  LINE_M, LINE_L, LINE_L,
  SKIN_L, SKIN_L,
  WHITE, WHITE);
const RAMP_SMOKE = Uint8Array.of(GLOW, CAPE_L, CAPE_M, CAPE_M, CAPE_D);
const RAMP_EMBER = Uint8Array.of(LINE_L, LINE_M, LINE_D, CAPE_D);
const RAMPS = [RAMP_SMOKE, RAMP_EMBER];
const RIM = Uint8Array.of(MOON_M, MOON_L, WHITE);
const RIM_BANDS = Uint16Array.of(28, 46, 70);   // the moon is far off: only a hand raised toward it catches its light
const LIGHT = Float32Array.of(0.7, -0.7);     // moonlight, high on the right
const RIM_OK = new Uint8Array(PAL.length).fill(1);
const AIR = new Uint8Array(PAL.length);
AIR[SKY0] = AIR[SKY1] = AIR[SKY2] = AIR[SKY3] = AIR[GLOW] = 1;

const IDLE = 0, SPREAD = 1, BLAST = 2, SWARM = 3, RETURN = 4, COLLAR = 5;
const DUR = Uint16Array.of(72, 54, 30, 150, 84, 90); // L = 480: cape flutter 60, wing beat 8
const EASE = Uint16Array.of(6, 36, 6, 30, 72, 48);
const EASE_OUT = Uint8Array.of(0, 0, 1, 0, 0, 0);
const OPEN = 0, RAISE = 1, LAUGH = 2, NP = 3;
const REST = Float32Array.of(0, 0, 0);          // cape wrapped, one hand holding it shut
const TARGET = [
  REST,
  Float32Array.of(1, 0, 0),                     // arms out, the cape spread like wings
  Float32Array.of(1, 0.3, 0.5),                 // it bursts: arms jerk up
  Float32Array.of(1, 1, 1),                     // arms high, laughing at the moon
  Float32Array.of(0.6, 0, 0),                   // the bats knit back as the arms come down
  REST,                                         // sample() tugs the collar on top of this
];
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const ctl = new Int32Array(3);      // embedding control: paused, fast-forward ticks left, fast-forward ticks per frame
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (ctl[0]) { clock[1] = 0; return; }             // paused by the embedding page: hold the frame
  if (ctl[1] > 0) {                                  // fast-forward: a burst of steps each frame, then play on
    for (let n = Math.min(ctl[1], ctl[2]); n > 0; n--, ctl[1]--) update();
    clock[1] = 0;
    render();
    return;
  }
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
// Head facing right, 7x8: h/H slicked hair with a widow's peak, k/S pale skin (eye and mouth drawn on top)
const HEAD = ['.hhhh..', 'hhHhhh.', 'hhhhSS.', 'hhSSSS.', 'hkSSSSS', '.kSSSS.', '..kSSS.', '...kk..'];
// Bat, 5x3, wings up and wings down
const BAT = ['#...###.##.###.', '.#.#.######...#'];
const TWO_PI = Math.PI * 2;
const headMap = new Uint8Array(56), batMap = new Uint8Array(30);
const noise = new Uint8Array(N);                    // per-pixel threshold: which bit of cape goes first
const fg = new Uint8Array(N).fill(EMPTY);           // the balustrade, drawn in front of him
const hX = new Float32Array(NB), hY = new Float32Array(NB), bD = new Int16Array(NB), bE = new Int16Array(NB);
const bR = new Float32Array(NB), bW = new Float32Array(NB), bPh = new Float32Array(NB);
const batX = new Float32Array(NB), batY = new Float32Array(NB), batOn = new Uint8Array(NB);
let openS = 0, hx = 0, hy = 0, fang = 0, flutter = 0, nhX = 0, nhY = 0, fhX = 0, fhY = 0, capeAmt = 1, ox = 0, oy = 0;

function buildBackground() {
  const seed = Uint32Array.of(1897);
  const rnd = () => { let x = seed[0]; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; seed[0] = x; return seed[0] / 4294967296; };
  const dith = (x, y, v) => v * 16 > BAYER[(y & 3) * 4 + (x & 3)];
  const EDGE = [0, 20, 40, 58, 999];
  for (let y = 0; y < H; y++) {
    let b = 0;
    while (y >= EDGE[b + 1]) b++;
    const seam = b < 3 && y === EDGE[b + 1] - 1; // one dithered row joins each band to the next
    for (let x = 0; x < W; x++) bg[y * W + x] = SKY0 + b + (seam && dith(x, y, 0.5) ? 1 : 0);
  }
  for (let k = 0; k < 24; k++) plot(bg, rnd() * W | 0, rnd() * 40 | 0, rnd() < 0.3 ? MOON_L : MOON_M); // stars
  lighten(MX, MY, 26, bg);                                                 // moon glow
  for (let dy = -MR; dy <= MR; dy++) for (let dx = -MR; dx <= MR; dx++) {
    const d = Math.hypot(dx, dy);
    if (d > MR + 0.3) continue;
    const crater = Math.hypot(dx + 4, dy - 2) < 3 || Math.hypot(dx - 3, dy + 4) < 2 || Math.hypot(dx - 5, dy - 5) < 1.6;
    plot(bg, MX + dx, MY + dy, d > MR - 1.2 && dx - dy < 0 ? MOON_M : crater ? MOON_M : MOON_L);
  }
  for (const [x0, x1, y] of [[70, 118, 33], [80, 110, 34], [60, 86, 38]]) hline(bg, x0, x1, y, SKY1); // thin cloud across the moon
  const tower = (x0, w, top, spire) => { // castle towers with pointed roofs and lit slits
    for (let x = x0; x < x0 + w; x++) for (let y = top; y < H; y++) plot(bg, x, y, x === x0 + w - 1 ? CAS_M : CAS_D);
    for (let y = top - spire; y < top; y++) { const hw = Math.round((y - top + spire) / spire * (w / 2 + 1)); hline(bg, x0 + (w >> 1) - hw, x0 + (w >> 1) + hw - 1, y, CAS_D); }
    for (let x = x0 - 1; x <= x0 + w; x += 2) plot(bg, x, top - 1, CAS_D);
  };
  tower(98, 11, 46, 14); tower(72, 8, 52, 10); tower(114, 7, 58, 8); tower(58, 6, 60, 7);
  for (let x = 56; x < W; x++) for (let y = 66 + ((x >> 2) & 1); y < H; y++) plot(bg, x, y, CAS_D); // curtain wall
  for (const [x, y] of [[102, 54], [106, 60], [75, 58], [117, 64], [88, 72], [96, 76]]) { plot(bg, x, y, WIN); plot(bg, x, y + 1, WIN); } // lit slits
  for (let y = 18; y < H; y++) for (let x = 0; x <= 18; x++) { // the keep wall on the left, moonlit on its edge
    const brick = y % 6 === 0 || (x + (y / 6 | 0) * 4) % 8 === 0;
    plot(bg, x, y, x === 18 ? STONE_L : brick ? STONE_D : STONE_M);
  }
  for (let y = 30; y < 86; y++) for (let x = 4; x <= 14; x++) { // pointed arch doorway, candlelight inside
    const top = 30 + Math.round(Math.abs(x - 9) ** 1.6 / 2);
    if (y < top) continue;
    plot(bg, x, y, y === top || x === 4 || x === 14 ? STONE_L : y > 72 && dith(x, y, (y - 72) / 16) ? WIN : CAS_D);
  }
  for (let y = 86; y < H; y++) hline(bg, 0, 74, y, y === 86 ? STONE_M : STONE_D); // balcony floor
  // Balustrade: rail, vase balusters, base, end post.
  for (let x = 18; x <= 72; x++) { plot(fg, x, 70, STONE_L); plot(fg, x, 71, STONE_M); plot(fg, x, 72, STONE_M); plot(fg, x, 73, STONE_D); plot(fg, x, 86, STONE_L); plot(fg, x, 87, STONE_M); plot(fg, x, 88, STONE_D); }
  const PROFILE = [1, 2, 2, 1, 1, 1, 2, 2, 2, 1, 1, 2];
  for (let cx = 23; cx <= 66; cx += 7) for (let r = 0; r < 12; r++) {
    const hw = PROFILE[r];
    for (let x = cx - hw; x <= cx + hw; x++) plot(fg, x, 74 + r, x === cx + hw ? STONE_L : x === cx - hw ? STONE_D : STONE_M);
  }
  for (let y = 66; y <= 88; y++) for (let x = 70; x <= 75; x++) plot(fg, x, y, x === 75 ? STONE_L : x === 70 ? STONE_D : STONE_M);
  hline(fg, 69, 76, 65, STONE_L); hline(fg, 69, 76, 66, STONE_M);
  for (let i = 0; i < N; i++) noise[i] = rnd() * 255 | 0;
  for (let k = 0; k < NB; k++) { // each bat's place in the spread cape, and its flight plan
    const left = k < NB / 2, u = rnd(), v = rnd() * (1 - u);
    const sx = AX + (left ? -3 : 3), sy = 49, hx0 = AX + (left ? -17 : 17), hy0 = left ? 38 : 40, bx = AX + (left ? -8 : 7), by = 69;
    hX[k] = sx + u * (hx0 - sx) + v * (bx - sx) - AX; hY[k] = sy + u * (hy0 - sy) + v * (by - sy);
    bD[k] = rnd() * 18 | 0; bE[k] = rnd() * 44 | 0;
    bR[k] = 15 + rnd() * 12; bW[k] = 0.034 + rnd() * 0.016; bPh[k] = rnd() * TWO_PI;
  }
  const HMAP = { '.': EMPTY, h: INK, H: CAPE_L, S: SKIN_L, k: SKIN_D };
  HEAD.forEach((row, y) => { for (let x = 0; x < 7; x++) headMap[y * 7 + x] = HMAP[row[x]]; });
  BAT.forEach((f, k) => { for (let i = 0; i < 15; i++) batMap[k * 15 + i] = f[i] === '#' ? 1 : 0; });
}

function ease(u) {
  return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, u)));
}
function mix(a, b, e) {
  return Math.round(a + (b - a) * e);
}
function swarmT() { // ticks since the cape burst; -1 before it
  return state === BLAST ? stT - 6 : state === SWARM ? 24 + stT : state === RETURN ? 174 + stT : state === COLLAR ? 258 + stT : -1;
}
function orbit(k, t) { // a bat's place circling the moon at swarm time t
  const a = bPh[k] + bW[k] * t;
  ox = MX + bR[k] * Math.cos(a); oy = MY + bR[k] * 0.72 * Math.sin(a) + Math.sin(t * 0.3 + bPh[k]) * 1.5;
}

// Freeze the smooth pose onto the pixel grid; the sprite only changes on these frames.
function sample() {
  snap.set(pose);
  const r = pose[RAISE], lg = pose[LAUGH];
  openS = pose[OPEN];
  hx = AX - 2 - (lg > 0.5 ? 1 : 0); hy = 41 + (lg > 0.5 ? (stT / 6 | 0) & 1 : 0); // laughing, head thrown back
  fang = lg > 0.5 ? 1 : 0;
  flutter = Math.round(Math.sin(tick * TWO_PI / 60));
  nhX = mix(AX + 4, AX + 17, openS); nhY = mix(56, 42 - r * 7, openS);
  fhX = mix(AX - 2, AX - 17, openS); fhY = mix(57, 40 - r * 7, openS);
  if (state === COLLAR) { // straightens the collar: hand up, two tugs, hand down
    const w = stT < 30 ? 0 : stT < 42 ? ease((stT - 30) / 12) : stT < 72 ? 1 : 1 - ease((stT - 72) / 12);
    const tug = stT === 48 || stT === 60 ? 1 : 0;
    nhX = mix(nhX, hx + 6 + tug, w); nhY = mix(nhY, hy + 8 - tug, w);
  }
  const t = swarmT();
  let home = 0;
  for (let k = 0; k < NB; k++) if (t < bD[k] || t >= 214 + bE[k]) home++;
  capeAmt = home / NB;
  srcX = MX; srcY = MY; rim = 2;
}

function step() {
  if (tick % POSE_STEP === 0) sample();
  if (state === BLAST && stT === 6) { // the cape comes apart
    for (let k = 0; k < 26; k++) spawn(MOTE, 24 + rand() * 20, AX + (rand() - 0.5) * 34, 42 + rand() * 26, 0, -0.2 - rand() * 0.3, 0);
    for (let k = 0; k < 10; k++) spawn(BURST, 14 + rand() * 12, AX + (rand() - 0.5) * 20, 50 + rand() * 14, (rand() - 0.5) * 1.6, -0.8 - rand(), 1);
    shakeT = 4;
  }
  const t = swarmT();
  for (let k = 0; k < NB; k++) { // leave, circle the moon, swoop back into the cape
    batOn[k] = 0;
    const back = 174 + bE[k];
    if (t < bD[k] || t >= back + 40) continue;
    batOn[k] = 1;
    const x0 = AX + hX[k], y0 = hY[k];
    if (t < bD[k] + 44) {
      const u = ease((t - bD[k]) / 44), cx = x0 + hX[k] * 0.8, cy = y0 - 28;
      orbit(k, bD[k] + 44);
      batX[k] = (1 - u) * (1 - u) * x0 + 2 * u * (1 - u) * cx + u * u * ox; batY[k] = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * cy + u * u * oy;
    } else if (t < back) {
      orbit(k, t); batX[k] = ox; batY[k] = oy;
    } else {
      const u = ease((t - back) / 40), s = 0.4 + 0.6 * openS, x2 = AX + hX[k] * s, y2 = hY[k] + (1 - openS) * 8;
      orbit(k, back);
      const cx = (ox + x2) / 2, cy = Math.max(oy, y2) + 12;
      batX[k] = (1 - u) * (1 - u) * ox + 2 * u * (1 - u) * cx + u * u * x2; batY[k] = (1 - u) * (1 - u) * oy + 2 * u * (1 - u) * cy + u * u * y2;
      if (t === back + 39) spawn(MOTE, 12 + rand() * 8, x2, y2, 0, -0.2, 0);   // stitches itself back in
    }
  }
}

function limb(ax, ay, bx, by, l1, l2, side, r0, r1, r2, dark, base, light) {
  joint(ax, ay, bx, by, l1, l2, side);
  capsule(spr, ax, ay, r0, jx, jy, r1, dark, base, light);
  capsule(spr, jx, jy, r1, bx, by, r2, dark, base, light);
}
function capePx(x, y, c) { // cape pixels thin out as bats leave and fill back in as they return
  if (x >= 0 && x < W && y >= 0 && y < H && noise[y * W + x] < capeAmt * 255.5) spr[y * W + x] = c;
}
// One spread wing: shoulder (ax, ay), hand (bx, by), hem (cx, cy). Red lining, dark hem, scalloped trailing edge.
function wing(ax, ay, bx, by, cx, cy) {
  const x0 = Math.min(ax, bx, cx), x1 = Math.max(ax, bx, cx), y0 = Math.min(ay, by, cy), y1 = Math.max(ay, by, cy);
  const tx = bx - ax, ty = by - ay, tl = Math.hypot(tx, ty) || 1, ex = cx - bx, ey = cy - by, el = Math.hypot(ex, ey) || 1;
  const area = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const w1 = ((bx - x) * (cy - y) - (by - y) * (cx - x)) / area, w2 = ((cx - x) * (ay - y) - (cy - y) * (ax - x)) / area;
      if (w1 < 0 || w2 < 0 || w1 + w2 > 1) continue;
      const dTop = Math.abs(tx * (y - ay) - ty * (x - ax)) / tl, dHem = Math.abs(ex * (y - by) - ey * (x - bx)) / el;
      const along = ((x - bx) * ex + (y - by) * ey) / (el * el);
      if (along > 0 && along < 1 && dHem < 2.6 * Math.abs(Math.sin(along * Math.PI * 3))) continue; // scallops
      const fold = (Math.atan2(y - ay, x - ax) * 9 | 0) & 1;
      capePx(x, y, dTop < 1.5 ? CAPE_M : dHem < 1.2 ? CAPE_D : dTop < 2.5 ? LINE_L : fold ? LINE_D : LINE_M);
    }
  }
}

function drawActor() {
  const spread = openS > 0.3;
  if (spread) {
    for (let y = 48; y <= 70; y++) for (let x = AX - 7; x <= AX + 6; x++) capePx(x, y, LINE_D); // lining behind him
    wing(AX - 3, 48, fhX, fhY, AX - 8, 70);
    wing(AX + 3, 48, nhX, nhY, AX + 7, 70);
  }
  rect(spr, AX - 3, 68, 2, 22, CAPE_D); rect(spr, AX + 1, 68, 2, 22, CAPE_D);                  // legs
  for (let y = 49; y <= 68; y++) { // frock coat
    const hw = y < 52 ? 3 : 4;
    for (let x = AX - hw; x < AX + hw; x++) plot(spr, x, y, x === AX - hw ? CAPE_D : x >= AX + hw - 2 ? CAPE_L : CAPE_M);
  }
  for (let y = 49; y <= 58; y++) { plot(spr, AX + 1, y, SHIRT); plot(spr, AX + 2, y, y < 51 ? SHIRT : CAPE_L); }
  plot(spr, AX + 2, 51, LINE_L); plot(spr, AX + 1, 52, LINE_M);         // ruby at the throat
  if (!spread) { // wrapped: the cape closes over the coat, a sliver of red at its edge
    for (let y = 48; y <= 72; y++) {
      const t = (y - 48) / 24, xl = Math.round(AX - 6 - t * 5) - (y > 62 ? flutter : 0), xr = y < 54 ? AX : Math.round(AX + 5 + t * 3);
      for (let x = xl; x <= xr; x++) capePx(x, y, x === xr ? LINE_M : x === xr - 1 ? CAPE_L : x <= xl + 1 ? CAPE_D : (x - AX) % 4 === 0 && y > 58 ? CAPE_D : CAPE_M);
    }
  }
  for (let r = 0; r < 8; r++) { // high collar, standing up behind his head
    for (let x = hx - 3 + (r >> 1); x <= hx; x++) plot(spr, x, hy + 1 + r, x === hx ? LINE_M : CAPE_M);
  }
  plot(spr, hx + 6, hy + 7, CAPE_M); plot(spr, hx + 6, hy + 8, LINE_M); plot(spr, hx + 7, hy + 8, CAPE_M);
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 7; c++) {
      const v = headMap[r * 7 + c];
      if (v !== EMPTY) plot(spr, hx + c, hy + r, v);
    }
  }
  plot(spr, hx + 4, hy + 3, LINE_L);                                     // red eye
  plot(spr, hx + 5, hy + 6, fang ? INK : SKIN_D); if (fang) plot(spr, hx + 5, hy + 7, WHITE); // mouth, a fang when he laughs
  if (spread) {
    limb(AX - 3, 50, fhX, fhY, 7, 8, -1, 1.5, 1.3, 1.1, CAPE_D, CAPE_D, CAPE_M);  // far arm
    rect(spr, fhX - 1, fhY - 1, 2, 2, SKIN_D);
    limb(AX + 3, 51, nhX, nhY, 7, 8, 1, 1.6, 1.4, 1.2, CAPE_D, CAPE_M, CAPE_L);   // near arm
  }
  rect(spr, nhX - 1, nhY - 1, 2, 2, SKIN_L); plot(spr, nhX + 1, nhY - 1, SKIN_D);  // long pale fingers
}

function drawUnder() {
  const fl = (tick / 12 | 0) % 4;                                        // candle flicker in the doorway
  for (let x = 6; x <= 12; x += 3) plot(buf, x + (fl & 1), 84 - (fl >> 1), WIN);
}
function drawOver() {
  for (let i = 0; i < N; i++) if (fg[i] !== EMPTY) buf[i] = fg[i];       // the balustrade in front of him
  drawParticles(false);
  for (let k = 0; k < NB; k++) { // bats, black against the moon and the sky
    if (!batOn[k]) continue;
    const x0 = Math.round(batX[k]) - 2, y0 = Math.round(batY[k]) - 1, f = (((tick >> 2) + k) & 1) * 15;
    for (let i = 0; i < 15; i++) if (batMap[f + i]) plot(buf, x0 + i % 5, y0 + (i / 5 | 0), INK);
    if (k % 3 === 0) plot(buf, x0 + 2, y0 + (f ? 1 : 2), LINE_L);         // some have red eyes
  }
  drawParticles(true);
}
// #endregion

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
  // Same-origin pages drive the loop through iframe.contentWindow.pixelAnims: pause() holds the frame, play() resumes,
  // and seek(t, rate) runs `rate` steps a frame forward to tick t of the loop (wrapping), then plays on.
  const loop = DUR.reduce((a, b) => a + b, 0);
  window.pixelAnims = Object.freeze({
    get tick() { return tick; }, loop,
    get paused() { return ctl[0] === 1; }, get seeking() { return ctl[1] > 0; },
    pause() { ctl[0] = 1; }, play() { ctl[0] = 0; },
    seek(t, rate = 10) { ctl[1] = ((t - tick) % loop + loop) % loop; ctl[2] = Math.min(loop, Math.max(1, Math.floor(rate) || 1)); ctl[0] = 0; },
  });
}
// #endregion
})();
