<title>Monkey King Staff</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #1a1014; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1a1014; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
<canvas id="view" role="img" aria-label="Pixel art Monkey King on a small cloud before the waterfall cliffs of Flower Fruit Mountain, twirling his golden staff, growing it to slam the ground in a ring of dust, then shrinking it to a needle behind his ear"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 160, H = 90;             // logical resolution
const GROUND_Y = 79;               // grass ledge under the cliffs
const FY = GROUND_Y - 1;           // dust and pebbles land here
const POSE_STEP = 6;               // 10 fps pose frames
const AX = 54, CLOUD_Y = 62;       // where the cloud hovers
const IMPX = 130;                  // where the staff lands

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#1a1014',
  '#5aa8e8', '#8ccaf2', '#c4e6f8',
  '#3e4a5a', '#6a7a82', '#9aa8a4',
  '#2e6a3a', '#4e9a44', '#8acc5a', '#f48aa8',
  '#3a7ab8', '#6ab4e4', '#d8f4ff',
  '#a8c4dc', '#e0eef6', '#ffffff',
  '#8a4a1e', '#c47a2c', '#eab05a',
  '#d88a78', '#f6c4a4',
  '#8a1e24', '#d03a2c', '#f0a030',
  '#b8801c', '#f0c030', '#fff0a0',
  '#9a8466', '#c8b48c', '#eee0c0',
];
const INK = 0, SKY0 = 1, SKY1 = 2, SKY2 = 3, ROCK_D = 4, ROCK_M = 5, ROCK_L = 6,
  LEAF_D = 7, LEAF_M = 8, LEAF_L = 9, PEACH = 10, WATER_D = 11, WATER_M = 12, WATER_L = 13,
  CLOUD_D = 14, CLOUD_M = 15, WHITE = 16, FUR_D = 17, FUR_M = 18, FUR_L = 19, FACE_D = 20, FACE_L = 21,
  RED_D = 22, RED_M = 23, TIGER = 24, GOLD_D = 25, GOLD_M = 26, GOLD_L = 27, DUST_D = 28, DUST_M = 29, DUST_L = 30;

// One step brighter per ramp; sunlit foliage and fur warm toward gold.
const LIGHTEN = Uint8Array.of(
  ROCK_D,
  SKY1, SKY2, WHITE,
  ROCK_M, ROCK_L, CLOUD_M,
  LEAF_M, LEAF_L, GOLD_L, WHITE,
  WATER_M, WATER_L, WHITE,
  CLOUD_M, WHITE, WHITE,
  FUR_M, FUR_L, GOLD_L,
  FACE_L, DUST_L,
  RED_M, TIGER, GOLD_M,
  GOLD_M, GOLD_L, WHITE,
  DUST_M, DUST_L, WHITE);
const RAMP_DUST = Uint8Array.of(DUST_L, DUST_M, DUST_D, ROCK_M);
const RAMP_ROCK = Uint8Array.of(ROCK_L, ROCK_M, ROCK_D, ROCK_D);
const RAMP_GOLD = Uint8Array.of(WHITE, GOLD_L, GOLD_M, GOLD_D);
const RAMP_CLOUD = Uint8Array.of(WHITE, CLOUD_M, CLOUD_D, SKY1);
const RAMP_SPRAY = Uint8Array.of(WHITE, WATER_L, WATER_M, WATER_D);
const RAMPS = [RAMP_DUST, RAMP_ROCK, RAMP_GOLD, RAMP_CLOUD, RAMP_SPRAY];
const RIM = Uint8Array.of(GOLD_M, GOLD_L, WHITE);
const RIM_BANDS = Uint16Array.of(10, 18, 28);
const LIGHT = Float32Array.of(-0.6, -0.8);    // midday sun, high on the left
const RIM_OK = new Uint8Array(PAL.length).fill(1);
RIM_OK[GOLD_D] = RIM_OK[GOLD_M] = RIM_OK[GOLD_L] = 0; // the staff's own gold stays put
const AIR = new Uint8Array(PAL.length);
AIR[SKY0] = AIR[SKY1] = AIR[SKY2] = 1;

// Head facing right, 9x9: f/F fur, c gold circlet, e ear, p/d face, E eye
const HEAD = ['..ffff...', '.fFFFff..', 'fcccccc..', 'ffffppp..', 'effpEpp..', 'effpppppp', '.ffppppd.',
  '..fpppp..', '...ff....'];

const IDLE = 0, GROW = 1, TWIRL = 2, SLAM = 3, SHRINK = 4, SETTLE = 5;
const DUR = Uint16Array.of(120, 60, 108, 72, 60, 60); // L = 480: bob 60, waterfall 32 rows at 2 px/tick
const EASE = Uint16Array.of(6, 30, 108, 6, 48, 54);
const EASE_OUT = Uint8Array.of(0, 0, 0, 1, 0, 0);
const FIRE_T = 6;
const HX = 0, HY = 1, FHX = 2, FHY = 3, CROUCH = 4, LEAN = 5, NP = 6;
const REST = Float32Array.of(4, -7, -3, 6, 0, 0);   // hand shading his eyes, the other on his hip
const TARGET = [
  REST,
  Float32Array.of(6, 1, -5, 3, 0.3, 0),             // holds out the needle as it grows into a staff
  Float32Array.of(7, 0, -6, 1, 0.5, -1),            // twirls it before his chest (sample() lifts it for the wind-up)
  Float32Array.of(9, 4, 5, 5, 1, 2),                // both hands drive it down across the valley
  Float32Array.of(-4, -8, -3, 6, 0, 0),             // tucks the shrunken needle behind his ear
  REST,
];
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
const headMap = new Uint8Array(81);
const WF_X0 = 12, WF_X1 = 23, WF_Y0 = 16, WF_Y1 = 75; // the Water Curtain
const WF_PHASE = new Uint8Array(W);
const SP = new Float32Array(4);                    // staff angle at the last pose frame, angle now, tip and butt radius
let cx = 0, hipX = 0, hipY = 0, chestY = 0, feetY = 0, cloudY = 0, hx = 0, hy = 0;
let nhX = 0, nhY = 0, fhX = 0, fhY = 0, qTail = 0;
let sbX = 0, sbY = 0, stX = 0, stY = 0, qThick = 0, qNeedle = 1, qStaff = 0;
let hitAge = 99;

function buildBackground() {
  const dith = (x, y, v) => v * 16 > BAYER[(y & 3) * 4 + (x & 3)];
  const EDGE = [0, 22, 42, 999];
  for (let y = 0; y < H; y++) {
    let b = 0;
    while (y >= EDGE[b + 1]) b++;
    const seam = b < 2 && y === EDGE[b + 1] - 1; // one dithered row joins each band to the next
    for (let x = 0; x < W; x++) bg[y * W + x] = SKY0 + b + (seam && dith(x, y, 0.5) ? 1 : 0);
  }
  for (const [x0, y0, r] of [[76, 10, 5], [83, 8, 6], [90, 11, 4], [114, 18, 4], [120, 16, 5]]) { // fair-weather clouds
    for (let dy = -r; dy <= r; dy++) for (let dx = -r - 2; dx <= r + 2; dx++)
      if ((dx * dx) / 1.6 + dy * dy <= r * r) plot(bg, x0 + dx, y0 + dy, dy > r * 0.4 ? CLOUD_M : WHITE);
  }
  for (let x = 0; x < W; x++) { // misty karst peaks far off
    const top = Math.round(50 - 9 * Math.max(0, Math.sin(x * 0.11 + 0.6)) - 6 * Math.max(0, Math.sin(x * 0.23 + 2)));
    for (let y = top; y < GROUND_Y; y++) plot(bg, x, y, y === top ? SKY2 : CLOUD_D);
  }
  // Flower Fruit Mountain: the cliff with the Water Curtain Cave on the left, a peach-crowned bluff on the right.
  const cliff = (x0, x1, top, lip) => {
    for (let x = x0; x <= x1; x++) {
      const t = Math.round(top + 2 * Math.sin(x * 0.5) + Math.abs(Math.sin(x * 0.21)) * 3);
      for (let y = t; y < GROUND_Y; y++) {
        let c = x <= x0 + 1 || (x - x0) % 9 === 4 ? ROCK_D : x >= x1 - 1 ? ROCK_L : (y + x * 3) % 13 === 0 ? ROCK_D : ROCK_M;
        if (y < t + 4) c = y === t ? LEAF_L : y < t + 2 ? LEAF_M : dith(x, y, 0.5) ? LEAF_D : c; // mossy crown
        if (x === lip && y > t + 3 && y < t + 16) c = LEAF_D;                                  // hanging vines
        plot(bg, x, y, c);
      }
    }
  };
  cliff(-2, 38, 10, 34);
  cliff(138, 162, 24, 150);
  for (const [x0, y0] of [[6, 7], [28, 8], [146, 21], [156, 22]]) { // peach trees, blossoms and fruit
    for (let dy = -3; dy <= 3; dy++) for (let dx = -4; dx <= 4; dx++) {
      if (dx * dx / 2 + dy * dy > 8) continue;
      plot(bg, x0 + dx, y0 + dy, (dx * 3 + dy * 5 + 40) % 7 === 0 ? PEACH : dy < 0 ? LEAF_L : LEAF_M);
    }
  }
  // Grass ledge and the plunge pool.
  for (let x = 0; x < W; x++) {
    const pool = x < 42;
    for (let y = GROUND_Y - (pool ? 3 : 0); y < H; y++) {
      const d = y - GROUND_Y;
      bg[y * W + x] = pool ? (d < 0 && (x + y * 3) % 7 === 0 ? WATER_L : d < 2 ? WATER_M : WATER_D)
        : d === 0 ? LEAF_L : d < 3 ? LEAF_M : d === 3 && dith(x, y, 0.5) ? LEAF_M : d < 6 ? LEAF_D : DUST_D;
    }
    if (!pool && x % 5 === 2) plot(bg, x, GROUND_Y - 1, LEAF_M);   // grass tufts
    if (!pool && x % 17 === 9) plot(bg, x, GROUND_Y - 1, PEACH);    // fallen blossoms
  }
  for (let x = 0; x < W; x++) WF_PHASE[x] = (x * 11) % 32;
  const HMAP = { '.': EMPTY, f: FUR_M, F: FUR_L, c: GOLD_M, e: FACE_D, p: FACE_L, d: FACE_D, E: INK };
  HEAD.forEach((row, y) => { for (let x = 0; x < 9; x++) headMap[y * 9 + x] = HMAP[row[x]]; });
}

function ease(u) {
  return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, u)));
}
function twirlAngle(t) { // two full turns, ending cocked up behind his head
  const e = ease(t / DUR[TWIRL]);
  return -1.37 - 0.9 * e + 12.566 * e;
}

// Freeze the smooth pose onto the pixel grid; the sprite and the staff only change on these frames.
function sample() {
  snap.set(pose);
  const bob = Math.round(Math.sin(tick / 60 * 6.2832));
  cloudY = CLOUD_Y + bob; feetY = cloudY - 3;
  cx = AX + Math.round(pose[LEAN]); hipX = AX + Math.round(pose[LEAN] * 0.5);
  hipY = feetY - 6 + Math.round(pose[CROUCH] * 2); chestY = hipY - 8;
  hx = cx - 4; hy = chestY - 9;
  nhX = cx + 2 + Math.round(pose[HX]); nhY = chestY + 2 + Math.round(pose[HY]);
  const lift = state === TWIRL ? ease((stT / DUR[TWIRL] - 0.7) / 0.3) : state === SLAM && stT < FIRE_T ? 1 : 0;
  nhX -= Math.round(lift * 4); nhY -= Math.round(lift * 11);            // wind-up: staff raised overhead
  fhX = cx - 2 + Math.round(pose[FHX]); fhY = chestY + 2 + Math.round(pose[FHY]);
  qTail = Math.max(-3, Math.min(3, Math.round(spring[0]) + bob));
  staffPose();

  if (qNeedle) { srcX = hx - 2; srcY = hy + 2; rim = 1; }
  else if (state === SLAM && stT >= FIRE_T) { srcX = IMPX; srcY = GROUND_Y - 2; rim = hitAge < 12 ? 3 : 1; } // glint where it lands
  else { srcX = nhX; srcY = nhY - 2; rim = 1; }
}

function staffPose() {
  qNeedle = state === IDLE || state === SETTLE || (state === GROW && stT < 6) || (state === SHRINK && stT >= 48) ? 1 : 0;
  qStaff = 1 - qNeedle;
  if (qNeedle) return;
  let a = -1.37, len = 22, back = 11;
  const ax = IMPX - nhX, ay = GROUND_Y - 1 - nhY, aim = Math.atan2(ay, ax), reach = Math.hypot(ax, ay) + 3;
  if (state === GROW) { len = 3 + 19 * ease((stT - 6) / 36); back = len / 2; }
  else if (state === TWIRL) { a = twirlAngle(stT); back = 11 - 8 * ease((stT / DUR[TWIRL] - 0.75) / 0.25); }
  else if (state === SLAM && stT < FIRE_T) { a = -2.27; back = 3; }
  else if (state === SLAM) { a = aim; len = reach; back = 3; }
  else { // shrinks back into his fist, turning upright on the way to his ear
    const k = ease(stT / 34);
    len = reach * (1 - k) + 3 * k; a = aim + (-1.37 - aim) * k; back = 3 + (len / 2 - 3) * k;
  }
  const dx = Math.cos(a), dy = Math.sin(a);
  sbX = Math.round(nhX - dx * back); sbY = Math.round(nhY - dy * back);
  stX = Math.round(nhX + dx * (len - back)); stY = Math.round(nhY + dy * (len - back));
  qThick = len > 30 ? 1 : 0;
  SP[0] = a; SP[2] = len - back; SP[3] = back;
}

function step() {
  stepSpring(0, state === TWIRL ? Math.sin(stT * 0.35) * 2 : state === SLAM ? -2 : 0); // tail whips with the effort
  hitAge++;
  if (tick % POSE_STEP === 0) sample();
  SP[1] = state === TWIRL ? twirlAngle(stT) : SP[0];
  if (state === SLAM && stT === FIRE_T) slam();

  if (stT % 8 === 4) spawn(MOTE, 24 + rand() * 20, AX - 12 + rand() * 3, cloudY + (rand() - 0.5) * 3, -0.35 - rand() * 0.2, -0.03, 3);
  if (tick % 6 === 3) spawn(MOTE, 30 + rand() * 20, WF_X0 + rand() * (WF_X1 - WF_X0), WF_Y1 - 1, (rand() - 0.5) * 0.4, -0.25 - rand() * 0.2, 4);
  if ((state === GROW && stT >= 6 && stT < 42 && stT % 3 === 0) || (state === SHRINK && stT < 36 && stT % 3 === 0))
    spawn(BURST, 10 + rand() * 10, stX, stY, (rand() - 0.5) * 1.2, -rand() * 0.8, 2); // gold glints off the growing tip
  if (state === SLAM && stT > FIRE_T && stT < 36 && stT % 3 === 0)
    spawn(MOTE, 30 + rand() * 30, IMPX + (rand() - 0.5) * 20, GROUND_Y - 2, (rand() - 0.5) * 0.4, -0.2 - rand() * 0.2, 0);
}
function slam() {
  hitAge = 0; shakeT = 16;
  for (let n = 0; n < 16; n++) { // dust thrown up and out
    const t = Math.PI * (1 + rand()), v = 0.6 + rand() * 1.6;
    spawn(BURST, 24 + rand() * 24, IMPX, GROUND_Y - 1, Math.cos(t) * v * 1.4, Math.sin(t) * v, 0);
  }
  for (let n = 0; n < 8; n++) spawn(BURST, 30 + rand() * 20, IMPX + (rand() - 0.5) * 6, GROUND_Y - 2, (rand() - 0.5) * 2.2, -1 - rand() * 1.4, 1);
}

function drawCloud() { // the somersault cloud: three puffs and a curl
  for (let dy = -5; dy <= 2; dy++) {
    for (let dx = -13; dx <= 12; dx++) {
      const a = (dx + 6) * (dx + 6) + dy * dy * 1.6 < 16, b = dx * dx + (dy + 1) * (dy + 1) * 1.6 < 22;
      const c = (dx - 6) * (dx - 6) + dy * dy * 1.6 < 14, d = (dx + 11) * (dx + 11) + (dy - 1) * (dy - 1) * 2 < 5;
      if (a || b || c || d) plot(spr, AX + dx, cloudY + dy, dy <= -3 ? WHITE : dy === 2 ? CLOUD_D : CLOUD_M);
    }
  }
  plot(spr, AX - 8, cloudY, CLOUD_D); plot(spr, AX - 7, cloudY - 1, CLOUD_D); plot(spr, AX - 6, cloudY, CLOUD_D);
  plot(spr, AX + 4, cloudY, CLOUD_D); plot(spr, AX + 5, cloudY - 1, CLOUD_D); plot(spr, AX + 6, cloudY, CLOUD_D);
}

function drawStaff() { // red lacquer rod with gold bands at both ends; thicker once it has grown
  const dx = stX - sbX, dy = stY - sbY, n = Math.max(Math.abs(dx), Math.abs(dy)) || 1, steep = Math.abs(dy) > Math.abs(dx);
  const ox = steep ? 1 : 0, oy = steep ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(sbX + dx * s / n), y = Math.round(sbY + dy * s / n), cap = s < 3 || s > n - 3;
    plot(spr, x, y, cap ? GOLD_L : RED_M);
    plot(spr, x + ox, y + oy, cap ? GOLD_D : RED_D);
    if (qThick) plot(spr, x - ox, y - oy, cap ? GOLD_M : TIGER);
  }
}

function drawActor() {
  joint(cx - 2, chestY + 2, fhX, fhY, 4, 4, 1); // far arm, behind him
  capsule(spr, cx - 2, chestY + 2, 1.5, jx, jy, 1.3, FUR_D, FUR_D, FUR_M);
  capsule(spr, jx, jy, 1.2, fhX, fhY, 1.1, FUR_D, FUR_D, FUR_M);
  plot(spr, fhX, fhY, FACE_D);
  const ty = hipY - 1; // tail curls up behind
  capsule(spr, hipX - 3, ty, 1.3, hipX - 7, ty + 2 + qTail, 1.1, FUR_D, FUR_M, FUR_L);
  capsule(spr, hipX - 7, ty + 2 + qTail, 1.1, hipX - 10, ty - 3 + qTail, 1, FUR_D, FUR_M, FUR_L);
  capsule(spr, hipX - 10, ty - 3 + qTail, 1, hipX - 8, ty - 6 + qTail, 0.8, FUR_D, FUR_M, FUR_L);
  drawCloud();
  for (let s = 0; s < 2; s++) { // legs, knees forward, black cloud-stepping boots
    const kx = hipX - 1 + s * 3, fx = AX - 3 + s * 6;
    joint(kx, hipY + 1, fx, feetY - 1, 3.5, 3.5, -1);
    capsule(spr, kx, hipY + 1, 1.5, jx, jy, 1.3, FUR_D, FUR_M, FUR_L);
    capsule(spr, jx, jy, 1.3, fx, feetY - 1, 1.2, FUR_D, FUR_M, FUR_L);
    rect(spr, fx - 1, feetY - 1, 3, 2, ROCK_D); plot(spr, fx + 2, feetY - 1, INK);
  }
  for (let r = 0; r < 4; r++) { // tiger-skin kilt
    for (let x = hipX - 4; x <= hipX + 4; x++) {
      if (r === 3 && (x & 1)) continue;
      plot(spr, x, hipY - 1 + r, r < 3 && (x + r) % 3 === 0 && x > hipX - 4 && x < hipX + 4 ? FUR_D : TIGER);
    }
  }
  const lean = cx - hipX;
  for (let i = 0; i < 7; i++) { // red tunic, golden fur at the collar, a yellow sash
    const c0 = hipX + Math.round(lean * (1 - i / 6)), y = chestY + i;
    for (let x = c0 - 3; x <= c0 + 3; x++) {
      let c = x === c0 - 3 ? TIGER : x === c0 + 3 ? RED_D : RED_M;
      if (i < 2 && (x === c0 || x === c0 + 1)) c = FUR_L;
      if (i === 6) c = x === c0 + 2 ? GOLD_L : GOLD_M;
      plot(spr, x, y, c);
    }
  }
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const v = headMap[r * 9 + c];
      if (v !== EMPTY) plot(spr, hx + c, hy + r, v);
    }
  }
  plot(spr, hx + 3, hy + 4, GOLD_L); // fiery golden eye
  if (qNeedle) { plot(spr, hx - 1, hy + 3, GOLD_M); plot(spr, hx - 2, hy + 2, GOLD_L); } // the needle behind his ear
  if (qStaff) drawStaff();
  joint(cx + 2, chestY + 2, nhX, nhY, 4, 4, 1); // near arm: red sleeve, furry forearm
  capsule(spr, cx + 2, chestY + 2, 1.6, jx, jy, 1.5, RED_D, RED_M, TIGER);
  capsule(spr, jx, jy, 1.3, nhX, nhY, 1.1, FUR_D, FUR_M, FUR_L);
  rect(spr, nhX - 1, nhY - 1, 2, 2, FACE_L);
}

function drawWaterfall() {
  const flow = (tick * 2) % 32; // 960 px per loop: 30 whole streak periods
  for (let x = WF_X0; x <= WF_X1; x++) {
    for (let y = WF_Y0; y < WF_Y1; y++) {
      const k = (y - flow + WF_PHASE[x] + 64) % 32;
      buf[y * W + x] = x === WF_X0 || x === WF_X1 ? WATER_D : k < 3 ? WHITE : k < 8 ? WATER_L : WATER_M;
    }
  }
  for (let x = WF_X0 - 3; x <= WF_X1 + 3; x++) { // churning foam, a 16-tick cycle
    const k = (x + (tick >> 2)) & 3;
    plot(buf, x, WF_Y1, k < 2 ? WHITE : WATER_L); plot(buf, x, WF_Y1 + 1, k === 1 ? WHITE : WATER_M);
  }
}

function drawUnder() {
  drawWaterfall();
  if ((state === SLAM && stT >= FIRE_T) || (state === SHRINK && stT < 36)) { // cracks split the ledge
    for (let k = -2; k <= 2; k++) {
      const len = 5 + (k & 1) * 3 + Math.abs(k);
      line(buf, IMPX, GROUND_Y, IMPX + k * len * 0.7, GROUND_Y + 1 + Math.abs(k), ROCK_D);
    }
  }
}

function ringE(x0, y0, rx, ry, c) { // flat ellipse on the ground
  const n = Math.max(16, Math.round(rx * 6));
  for (let k = 0; k < n; k++) plot(buf, Math.round(x0 + Math.cos(k * 6.2832 / n) * rx), Math.round(y0 + Math.sin(k * 6.2832 / n) * ry), c);
}

function drawOver() {
  drawParticles(false);
  if (state === TWIRL && stT > 6) { // blur between the last pose frame and the spin now
    for (let k = 0; k <= 10; k++) {
      const a = SP[0] + (SP[1] - SP[0]) * k / 10, c = k > 6 ? WHITE : GOLD_L;
      if ((k & 1) && k < 7) continue;
      plot(buf, Math.round(nhX + Math.cos(a) * SP[2]), Math.round(nhY + Math.sin(a) * SP[2]), c);
      plot(buf, Math.round(nhX - Math.cos(a) * SP[3]), Math.round(nhY - Math.sin(a) * SP[3]), c);
    }
  }
  if (state === SLAM && stT >= FIRE_T && stT < FIRE_T + 8) { // the swing's arc, overhead to the ground
    const f = stT - FIRE_T, aim = SP[0];
    for (let k = 0; k <= 30; k++) {
      const a = -2.27 + (aim + 2.27) * k / 30;
      for (let r = 18; r <= 22; r += 2) if ((k + r + f) & 1) plot(buf, Math.round(nhX + Math.cos(a) * r), Math.round(nhY + Math.sin(a) * r), f < 4 ? WHITE : GOLD_L);
    }
  }
  if (hitAge < 30) { // two rings of dust roll out from the blow
    const f = hitAge, c = f < 8 ? DUST_L : f < 18 ? DUST_M : DUST_D;
    ringE(IMPX, GROUND_Y, 4 + f * 1.8, 1 + f * 0.5, c);
    if (f >= 6) ringE(IMPX, GROUND_Y, 4 + (f - 6) * 1.8, 1 + (f - 6) * 0.5, f < 14 ? DUST_L : DUST_M);
    if (f < 3) lighten(IMPX, GROUND_Y, 6);
  }
  drawParticles(true);
}
// #endregion

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
}
// #endregion
})();
</script>
