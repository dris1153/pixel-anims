<title>Moon Hopper</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; background: #05050c; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05050c; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
</style>
<canvas id="view" role="img" aria-label="Pixel art astronaut bobbing in low gravity on a cratered moon, jetpack-hopping across a crater under a ringed planet, drifting down with dust puffs, landing with a soft bounce and waving"></canvas>
<script>
'use strict';
// pixel-anims: keep every ENGINE region verbatim, rewrite every SCENE region for a new subject.
(() => {
// #region SCENE config
const W = 160, H = 90;             // logical resolution
const GROUND = 68;                 // regolith under the astronaut's boots
const FY = H - 1;                  // no single floor under scrolling craters: dust is culled in step()
const POSE_STEP = 6;               // 10 fps pose frames
const AX = 40;                     // the camera keeps the astronaut here
const TILE = 80;                   // the ground repeats every 80px: one hop scrolls exactly one tile

// Index 0 must be the darkest ink: the engine uses it for outlines and the letterbox.
const PAL = [
  '#05050c',
  '#0a0a18', '#14142c', '#6a6a90',
  '#7a4a2a', '#c07a40', '#e8b070', '#6a7090', '#b8c0d8',
  '#2e2e38', '#5a5a66', '#8e8e98', '#c4c4cc', '#3e3e4c',
  '#8a92a8', '#c8cedc', '#f4f6fc',
  '#a8741a', '#e8b030', '#fff0a0',
  '#d04030', '#3a6ad0',
  '#4a4e5e', '#7a8090',
  '#ffe070', '#ff9030', '#ffffff',
];
const INK = 0, SPACE0 = 1, SPACE1 = 2, STAR_D = 3, PL_D = 4, PL_M = 5, PL_L = 6, RING_D = 7, RING_L = 8,
  MOON_D = 9, MOON_M = 10, MOON_L = 11, MOON_H = 12, FAR = 13, SUIT_D = 14, SUIT_M = 15, SUIT_L = 16,
  VISOR_D = 17, VISOR_M = 18, VISOR_L = 19, RED = 20, BLUE = 21, PACK_D = 22, PACK_M = 23, FLAME_Y = 24, FLAME_O = 25, WHITE = 26;

// One step brighter per ramp; the suit goes white, the gold visor goes pale.
const LIGHTEN = Uint8Array.of(
  SPACE1,
  SPACE1, STAR_D, WHITE,
  PL_M, PL_L, VISOR_L, RING_L, WHITE,
  MOON_M, MOON_L, MOON_H, WHITE, MOON_M,
  SUIT_M, SUIT_L, WHITE,
  VISOR_M, VISOR_L, WHITE,
  FLAME_O, RING_L,
  PACK_M, SUIT_D,
  WHITE, FLAME_Y, WHITE);
const RAMP_FLAME = Uint8Array.of(WHITE, FLAME_Y, FLAME_O, RED);
const RAMP_DUST = Uint8Array.of(MOON_H, MOON_L, MOON_M, MOON_D);
const RAMP_SMOKE = Uint8Array.of(SUIT_L, SUIT_M, SUIT_D, PACK_D);
const RAMPS = [RAMP_FLAME, RAMP_DUST, RAMP_SMOKE];
const RIM = Uint8Array.of(FLAME_O, FLAME_Y, WHITE);
const RIM_BANDS = Uint16Array.of(10, 18, 28);
const LIGHT = Float32Array.of(-0.8, -0.6);    // hard sunlight from the left
const RIM_OK = new Uint8Array(PAL.length).fill(1);
RIM_OK[FLAME_Y] = RIM_OK[FLAME_O] = RIM_OK[VISOR_L] = 0;
const AIR = new Uint8Array(PAL.length);
AIR[SPACE0] = AIR[SPACE1] = 1;

const IDLE = 0, CROUCH = 1, HOP = 2, DRIFT = 3, LAND = 4, WAVE = 5;
const DUR = Uint16Array.of(108, 30, 60, 90, 48, 144); // L = 480: the world scrolls one 80px tile per loop
const EASE = Uint16Array.of(6, 24, 12, 60, 6, 30);
const EASE_OUT = Uint8Array.of(0, 0, 1, 0, 1, 0);
const TOUCH_T = 6;                                // boots meet the ground, in LAND ticks
const SQUASH = 0, LEAN = 1, TUCK = 2, ARMS = 3, NP = 4;
const REST = Float32Array.of(0, 0, 0, 0);         // standing, arms at the sides
const TARGET = [
  REST,
  Float32Array.of(1, 0.5, 0, 0),                  // knees bent, jetpack lighting
  Float32Array.of(0, 1, 1, 1),                    // springs up and forward, arms out
  Float32Array.of(0, 0.3, 0.6, 0.8),              // floats down, legs dangling
  Float32Array.of(0.8, 0, 0, 0.3),                // soft landing: squashes into the dust
  REST,                                           // sample() raises the waving arm on top of this
];
// #endregion

// #region ENGINE
const N = W * H, STEP_MS = 1000 / 60, EMPTY = 255;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5); // 4x4 ordered dither, 0-15
const SHAKE = Int8Array.of(1, -1, 0, 1, -1, 1, 0, -1);

const bg = new Uint8Array(N);   // static backdrop, built once
const buf = new Uint8Array(N);  // indexed frame
const spr = new Uint8Array(N);  // actor layer, EMPTY where transparent

const view = document.getElementById('view');
const vctx = view.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H);
const u32 = new Uint32Array(img.data.buffer);
const LE = new Uint8Array(Uint32Array.of(1).buffer)[0] === 1;
const PAL32 = Uint32Array.from(PAL, hex => {
  const v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return (LE ? 0xff000000 | b << 16 | g << 8 | r : r << 24 | g << 16 | b << 8 | 0xff) >>> 0;
});
const RB = Uint32Array.from(RIM_BANDS, r => r * r);

// Particle pool (structure of arrays). ORBIT reuses pvx as angular speed and pvy as radius decay.
const MAXP = 320, ORBIT = 1, BURST = 2, TRAIL = 3, MOTE = 4;
const pKind = new Uint8Array(MAXP), pLife = new Int16Array(MAXP), pMax = new Int16Array(MAXP), pRamp = new Uint8Array(MAXP);
const px = new Float32Array(MAXP), py = new Float32Array(MAXP);
const pqx = new Float32Array(MAXP), pqy = new Float32Array(MAXP);
const pvx = new Float32Array(MAXP), pvy = new Float32Array(MAXP);
const pa = new Float32Array(MAXP), pr = new Float32Array(MAXP);
let cursor = 0;

const pose = Float32Array.from(TARGET[0]), from = Float32Array.from(TARGET[0]), snap = Float32Array.from(TARGET[0]);
const spring = new Float32Array(8); // up to 4 damped springs as [pos, vel] pairs
const clock = new Float64Array(2);  // last frame time, accumulator
const rng = Uint32Array.of(0x9e3779b9);
let state = 0, stT = -1, tick = -1;
let srcX = 0, srcY = 0, rim = 1; // FX light (also the orbit center) and its level, set by sample()
let shakeT = 0, flashT = 0, shakeX = 0, shakeY = 0, scale = 1, viewX = 0, viewY = 0;
let jx = 0, jy = 0;              // joint() result
let cropX = 0, cropY = 0, cropW = W, cropH = H; // region shown on screen; QA zooms in via #t=N&crop=x,y,w,h

// Seeded xorshift32 so #t=N always renders the same frame. Never use Math.random.
function rand() {
  let x = rng[0];
  x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  rng[0] = x;
  return rng[0] / 4294967296;
}

function plot(t, x, y, c) {
  if (x >= 0 && x < W && y >= 0 && y < H) t[y * W + x] = c;
}
function hline(t, x0, x1, y, c) {
  for (let x = x0; x <= x1; x++) plot(t, x, y, c);
}
function rect(t, x, y, w, h, c) {
  for (let j = 0; j < h; j++) hline(t, x, x + w - 1, y + j, c);
}
function line(t, x0, y0, x1, y1, c, yMax = H - 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let s = 0; s <= n; s++) {
    const y = Math.round(y0 + (y1 - y0) * s / n);
    if (y <= yMax) plot(t, Math.round(x0 + (x1 - x0) * s / n), y, c);
  }
}
// 2px prop from one DDA so both edges step together: dark edge left of steep lines, below shallow ones.
function line2(t, x0, y0, x1, y1, light, dark, yMax = H - 1) {
  const ax = Math.abs(x1 - x0), ay = Math.abs(y1 - y0), n = Math.max(ax, ay) || 1;
  const ox = ay > ax ? -1 : 0, oy = ay > ax ? 0 : 1;
  for (let s = 0; s <= n; s++) {
    const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
    if (y + oy <= yMax) plot(t, x + ox, y + oy, dark);
    if (y <= yMax) plot(t, x, y, light);
  }
}
// Tapered capsule (x0,y0,r0)-(x1,y1,r1) shaded by facing toward LIGHT: necks, tails, limbs, sleeves.
function capsule(t, x0, y0, r0, x1, y1, r1, dark, base, light) {
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy || 1, R = Math.ceil(Math.max(r0, r1));
  const xa = Math.floor(Math.min(x0, x1)) - R, xb = Math.ceil(Math.max(x0, x1)) + R;
  const ya = Math.floor(Math.min(y0, y1)) - R, yb = Math.ceil(Math.max(y0, y1)) + R;
  for (let y = ya; y <= yb; y++) {
    for (let x = xa; x <= xb; x++) {
      const u = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / len2));
      const qx = x - x0 - dx * u, qy = y - y0 - dy * u, r = r0 + (r1 - r0) * u;
      if (qx * qx + qy * qy > r * r) continue;
      const f = (qx * LIGHT[0] + qy * LIGHT[1]) / (r || 1); // -1 shadow side .. 1 lit side
      plot(t, x, y, f > 0.35 ? light : f < -0.35 ? dark : base);
    }
  }
}
// Two-bone solve (elbow, knee) from root (ax,ay) to end (bx,by); side +-1 picks the bend. Writes jx, jy.
function joint(ax, ay, bx, by, l1, l2, side) {
  const dx = bx - ax, dy = by - ay, dist = Math.sqrt(dx * dx + dy * dy) || 0.001, d = Math.min(dist, l1 + l2);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / dist, uy = dy / dist;
  jx = Math.round(ax + ux * a - uy * h * side);
  jy = Math.round(ay + uy * a + ux * h * side);
}
function disc(cx, cy, r, c, t = buf) {
  const k = Math.ceil(r);
  for (let dy = -k; dy <= k; dy++)
    for (let dx = -k; dx <= k; dx++) if (dx * dx + dy * dy <= r * r) plot(t, cx + dx, cy + dy, c);
}
function ring(cx, cy, r, c, t = buf) {
  r = Math.round(r);
  for (let x = r, y = 0, err = 1 - r; x >= y; y++) {
    plot(t, cx + x, cy + y, c); plot(t, cx - x, cy + y, c);
    plot(t, cx + x, cy - y, c); plot(t, cx - x, cy - y, c);
    plot(t, cx + y, cy + x, c); plot(t, cx - y, cy + x, c);
    plot(t, cx + y, cy - x, c); plot(t, cx - y, cy - x, c);
    if (err < 0) err += 2 * y + 3;
    else { err += 2 * (y - x) + 5; x--; }
  }
}
// Posterized glow (core, solid falloff, checker fringe) that only tints AIR pixels.
function halo(cx, cy, r, core, mid, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.09, r2 = r * r * 0.36;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r || !AIR[t[i]]) continue;
      if (d2 <= r1) t[i] = core;
      else if (d2 <= r2 || (x + y) & 1) t[i] = mid;
    }
  }
}
// Light pool on any surface (floor, wall, body): 2 LIGHTEN steps at the core, 1 inside, checker fringe.
function lighten(cx, cy, r, t = buf) {
  r = Math.round(r);
  const r1 = r * r * 0.16, r2 = r * r * 0.5;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx, d2 = dx * dx + dy * dy, i = y * W + x;
      if (x < 0 || x >= W || d2 > r * r) continue;
      if (d2 <= r1) t[i] = LIGHTEN[LIGHTEN[t[i]]];
      else if (d2 <= r2 || (x + y) & 1) t[i] = LIGHTEN[t[i]];
    }
  }
}

function spawn(kind, life, x, y, vx, vy, ramp = 0) {
  let i = cursor;
  for (let n = 0; n < MAXP && pKind[i]; n++) i = (i + 1) % MAXP; // pool full: recycle the slot at cursor
  cursor = (i + 1) % MAXP;
  pKind[i] = kind; pLife[i] = pMax[i] = Math.max(2, life); pRamp[i] = ramp;
  px[i] = pqx[i] = x; py[i] = pqy[i] = y; pvx[i] = vx; pvy[i] = vy;
  return i;
}
// Spark spiralling into (srcX, srcY), starting at an angle in [a0, a0 + arc); lives until its radius is ~1px.
function spawnOrbit(r, speed, decay, a0 = 0, arc = 6.283, ramp = 0) {
  const a = a0 + rand() * arc;
  const i = spawn(ORBIT, Math.log(r / 1.2) / -Math.log(decay), srcX + Math.cos(a) * r, srcY + Math.sin(a) * r * 0.5,
    speed, decay, ramp);
  pa[i] = a; pr[i] = r;
  return i;
}
function updateParticles() {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    if (--pLife[i] <= 0) { pKind[i] = 0; continue; }
    pqx[i] = px[i]; pqy[i] = py[i];
    if (k === ORBIT) {
      pr[i] *= pvy[i];
      pa[i] += pvx[i] * 14 / (pr[i] + 4); // spins faster as it falls inward
      px[i] = srcX + Math.cos(pa[i]) * pr[i];
      py[i] = srcY + Math.sin(pa[i]) * pr[i] * 0.5;
      continue;
    }
    if (k === BURST) { pvx[i] *= 0.93; pvy[i] = pvy[i] * 0.93 + 0.035; }
    else if (k === TRAIL) { pvx[i] *= 0.9; pvy[i] *= 0.9; }
    else pvx[i] = Math.sin(pLife[i] * 0.15) * 0.08;
    px[i] += pvx[i]; py[i] += pvy[i];
    if (py[i] > FY) { py[i] = FY; pvy[i] *= -0.45; pvx[i] *= 0.7; }
  }
}
function stepSpring(k, target) {
  spring[k + 1] = (spring[k + 1] + (target - spring[k]) * 0.03) * 0.88;
  spring[k] += spring[k + 1];
}

// Stamp the actor over the scene: auto outline in ink, plus a 1px rim on edges facing (srcX, srcY).
function composite() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = spr[i];
      if (c === EMPTY) {
        if ((x > 0 && spr[i - 1] !== EMPTY) || (x < W - 1 && spr[i + 1] !== EMPTY) ||
          (y > 0 && spr[i - W] !== EMPTY) || (y < H - 1 && spr[i + W] !== EMPTY)) buf[i] = 0;
        continue;
      }
      const dx = srcX - x, dy = srcY - y, d2 = dx * dx + dy * dy;
      const lv = rim - (d2 < RB[0] ? 0 : d2 < RB[1] ? 1 : d2 < RB[2] ? 2 : 3);
      const sx = dx > 1 ? 1 : dx < -1 ? -1 : 0, sy = dy > 1 ? 1 : dy < -1 ? -1 : 0;
      const open = (sx !== 0 && (x + sx < 0 || x + sx >= W || spr[i + sx] === EMPTY)) ||
        (sy !== 0 && (y + sy < 0 || y + sy >= H || spr[i + sy * W] === EMPTY));
      buf[i] = lv > 0 && RIM_OK[c] && open ? (lv === 1 ? LIGHTEN[c] : RIM[Math.min(lv, 4) - 2]) : c;
    }
  }
}

function dot(fx, fy, c, back) {
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;
  if (!back || spr[i] === EMPTY) buf[i] = c;
}
// Orbiting sparks on the far half of their ellipse pass behind the actor.
function drawParticles(front) {
  for (let i = 0; i < MAXP; i++) {
    const k = pKind[i];
    if (!k) continue;
    const back = k === ORBIT && Math.sin(pa[i]) < 0;
    if (back === front) continue;
    const ramp = RAMPS[pRamp[i]], n = ramp.length, step = (pMax[i] - pLife[i]) * n / pMax[i] | 0;
    dot(pqx[i], pqy[i], ramp[Math.min(n - 1, step + 1)], back);
    dot(px[i], py[i], ramp[step], back);
  }
}

function update() {
  tick++;
  if (++stT >= DUR[state]) { state = (state + 1) % DUR.length; stT = 0; from.set(pose); }
  const p = Math.min(1, stT / EASE[state]);
  const e = EASE_OUT[state] ? p * (2 - p) : 0.5 - 0.5 * Math.cos(Math.PI * p);
  const to = TARGET[state];
  for (let k = 0; k < NP; k++) pose[k] = from[k] + (to[k] - from[k]) * e;
  step();
  updateParticles();
  if (calm) shakeT = flashT = 0;
  if (shakeT > 0) shakeT--;
  if (flashT > 0) flashT--;
  const amp = shakeT > 8 ? 2 : shakeT > 0 ? 1 : 0, s = (shakeT >> 1) & 7;
  shakeX = SHAKE[s] * amp; shakeY = SHAKE[(s + 3) & 7] * amp;
}
function render() {
  buf.set(bg);
  drawUnder();
  spr.fill(EMPTY);
  drawActor();
  composite();
  drawOver();
  if (flashT > 0) for (let i = 0; i < N; i++) buf[i] = LIGHTEN[buf[i]]; // one LIGHTEN step per flash frame
  present();
}
function present() {
  for (let i = 0; i < N; i++) u32[i] = PAL32[buf[i]];
  octx.putImageData(img, 0, 0);
  vctx.fillStyle = PAL[0];
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(off, cropX, cropY, cropW, cropH, viewX + shakeX * scale, viewY + shakeY * scale, cropW * scale, cropH * scale);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.max(1, Math.floor(Math.min(view.width / cropW, view.height / cropH)));
  viewX = (view.width - cropW * scale) >> 1;
  viewY = (view.height - cropH * scale) >> 1;
  vctx.imageSmoothingEnabled = false; // resizing resets context state
  present();
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - clock[0];
  clock[0] = now;
  if (Math.abs(dt - STEP_MS) < 1) dt = STEP_MS; // absorb vsync jitter: one step per frame on 60 Hz displays
  clock[1] = Math.min(250, clock[1] + Math.max(0, dt));
  let steps = 0;
  while (clock[1] >= STEP_MS) { clock[1] -= STEP_MS; update(); steps++; }
  if (steps) render();
}
// Fail loudly at boot on SCENE config mistakes that would otherwise render wrong silently.
function checkContract() {
  const fail = msg => { throw new Error('pixel-anims contract: ' + msg); };
  const colors = PAL.length;
  if (!PAL.every(h => /^#[0-9a-f]{6}$/i.test(h))) fail('PAL entries must be #rrggbb');
  if (colors > EMPTY) fail('PAL is limited to 255 colors');
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM_OK', RIM_OK], ['AIR', AIR]])
    if (lut.length !== colors) fail(`${name} must have PAL.length entries`);
  for (const [name, lut] of [['LIGHTEN', LIGHTEN], ['RIM', RIM], ...RAMPS.map((r, k) => [`RAMPS[${k}]`, r])])
    if (!lut.length || lut.some(c => c >= colors)) fail(`${name} must hold palette indices`);
  if (RIM.length !== 3 || RIM_BANDS.length !== 3) fail('RIM and RIM_BANDS need 3 entries');
  const states = DUR.length;
  if (EASE.length !== states || EASE_OUT.length !== states || TARGET.length !== states)
    fail('DUR, EASE, EASE_OUT and TARGET need one entry per state');
  DUR.forEach((d, k) => {
    if (d % POSE_STEP) fail(`DUR[${k}] must be a multiple of POSE_STEP`);
    if (!(EASE[k] >= 1 && EASE[k] <= d)) fail(`EASE[${k}] must be within 1..DUR[${k}]`);
    if (TARGET[k].length !== NP) fail(`TARGET[${k}] needs NP values`);
  });
  if (TARGET[states - 1].some((v, k) => v !== TARGET[0][k])) fail('the last state must return to TARGET[0]');
}
// #endregion

// #region SCENE logic
const GT = new Int8Array(TILE);                  // ground height across one tile
const SC = new Float32Array(3);                  // world scroll px, height above the ground, jet thrust 0-1
const SCROLL = 0, ALT = 1, THRUST = 2;
let footY = GROUND - 1, hipY = 0, cx = AX, bootDX = 0, bootUp = 0, nhX = 0, nhY = 0, fhX = 0, fhY = 0, nzX = 0, nzY = 0;

function buildBackground() {
  const seed = Uint32Array.of(7777);
  const rnd = () => { let x = seed[0]; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; seed[0] = x; return seed[0] / 4294967296; };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) bg[y * W + x] = y < 44 ? SPACE0 : SPACE1;
  for (let n = 0; n < 70; n++) plot(bg, rnd() * W | 0, rnd() * 58 | 0, n % 5 ? STAR_D : WHITE);
  for (const [x, y] of [[20, 10], [64, 6], [150, 40]]) { plot(bg, x - 1, y, STAR_D); plot(bg, x + 1, y, STAR_D); plot(bg, x, y - 1, STAR_D); plot(bg, x, y + 1, STAR_D); plot(bg, x, y, WHITE); }
  // A banded giant with a tilted ring: back of the ring, the planet, then the front of the ring across it.
  const PX = 118, PY = 24, tilt = -0.25, ct = Math.cos(tilt), st = Math.sin(tilt);
  const ringPart = front => {
    for (let k = 0; k < 360; k++) {
      const a = k / 360 * 6.2832, sn = Math.sin(a);
      if ((sn >= 0) !== front) continue;
      for (const [rx, c] of [[26, RING_L], [25, RING_L], [23, RING_D]]) {
        const dx = Math.cos(a) * rx, dy = sn * rx * 0.2;
        plot(bg, Math.round(PX + dx * ct - dy * st), Math.round(PY + dx * st + dy * ct), c);
      }
    }
  };
  ringPart(false);
  for (let dy = -14; dy <= 14; dy++) for (let dx = -14; dx <= 14; dx++) {
    if (dx * dx + dy * dy > 196) continue;
    const band = ((dy + 14) / 4 | 0) & 1;
    plot(bg, PX + dx, PY + dy, dx > 6 + (dy >> 2) ? PL_D : dx < -9 ? PL_L : band ? PL_L : PL_M);
  }
  ringPart(true);
  for (let u = 0; u < TILE; u++) { // one tile of ground: gentle roll, a crater with a raised lip, a small pit
    let y = GROUND + Math.round(Math.sin(u * 0.07854) * 0.8);
    const d = (u - 62) / 16, e = Math.abs(Math.abs(d) - 1), s = (u - 20) / 4;
    if (Math.abs(d) < 1) y += Math.round(9 * (1 - d * d));
    if (e < 0.2) y -= Math.round(2 * (1 - e / 0.2));
    if (Math.abs(s) < 1) y += Math.round(1.5 * (1 - s * s));
    GT[u] = y;
  }
}

function ease(u) {
  return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, u)));
}
function scene() { // scroll, altitude and thrust follow the state clock
  let s = 0, alt = 0, thr = 0;
  if (state === IDLE) alt = Math.abs(Math.sin(stT * Math.PI / 36)) * 2;     // three lazy low-gravity bobs
  else if (state === CROUCH) thr = stT > 18 ? 0.3 : 0;
  else if (state === HOP) { s = TILE * ease(stT / 150); alt = 26 * (1 - (1 - stT / 60) ** 2); thr = stT < 36 ? 1 : Math.max(0, 1 - (stT - 36) / 12); }
  else if (state === DRIFT) { s = TILE * ease((stT + 60) / 150); alt = 1 + 25 * (1 - (stT / 90) ** 2); thr = stT % 30 < 6 && stT < 80 ? 0.45 : 0; }
  else if (state === LAND) { s = TILE; alt = stT < TOUCH_T ? 1 - stT / TOUCH_T : 3 * Math.sin(Math.PI * Math.min(1, (stT - TOUCH_T) / 36)); }
  else if (state === WAVE) s = TILE;
  SC[SCROLL] = s; SC[ALT] = alt; SC[THRUST] = thr;
}

// Freeze the smooth pose onto the pixel grid; the sprite only changes on these frames.
function sample() {
  snap.set(pose);
  const a = pose[ARMS], tuck = pose[TUCK];
  footY = GROUND - 1 - Math.round(SC[ALT]);
  hipY = footY - 6 + Math.round(pose[SQUASH] * 2);
  cx = AX + Math.round(pose[LEAN]);
  bootDX = -Math.round(tuck); bootUp = Math.round(tuck * 3);
  fhX = cx - 3 - Math.round(a * 4); fhY = hipY - 1 - Math.round(a * 7);
  nhX = cx + 3 + Math.round(a * 4); nhY = hipY - 1 - Math.round(a * 8);
  if (state === WAVE) { // raise a glove and wave three times
    const up = stT < 12 ? ease(stT / 12) : stT < 96 ? 1 : 1 - ease((stT - 96) / 30);
    const osc = up > 0.9 ? Math.round(Math.sin(stT / 24 * 6.2832) * 2) : 0;
    nhX = Math.round(cx + 3 + up * 7) + osc; nhY = Math.round(hipY - 1 - up * 12);
  }
  nzX = cx - 6; nzY = hipY + 1;
  if (SC[THRUST] > 0.05) { srcX = nzX; srcY = nzY + 3; rim = 1 + Math.round(SC[THRUST] * 3); }
  else { srcX = cx - 12; srcY = hipY - 16; rim = 1; }
}

function step() {
  scene();
  if (tick % POSE_STEP === 0) sample();
  const sp = state === HOP || state === DRIFT ? 0.8 : 0; // roughly how fast the ground slides past
  if (state === HOP && stT < 8) // launch dust kicked out sideways, slow in the weak gravity
    spawn(BURST, 30 + rand() * 20, AX + (rand() - 0.5) * 6, GROUND - 1, (rand() - 0.5) * 2.4, -0.3 - rand() * 0.6, 1);
  if (SC[THRUST] > 0.3 && tick % 3 === 0)
    spawn(TRAIL, 18 + rand() * 12, nzX, nzY + 3, -sp * 2 + (rand() - 0.5) * 0.4, 0.5 + rand() * 0.4, 2);
  if (state === LAND && stT === TOUCH_T) {
    shakeT = 4;
    for (let n = 0; n < 16; n++) {
      const d = rand() < 0.5 ? -1 : 1;
      spawn(BURST, 34 + rand() * 24, AX + d * (1 + rand() * 3), GROUND - 1, d * (0.3 + rand() * 1.1), -0.2 - rand() * 0.5, 1);
    }
  }
  if (state === IDLE && (stT === 36 || stT === 72)) // little puffs where the boots touch
    for (let n = 0; n < 3; n++) spawn(BURST, 20 + rand() * 10, AX + (rand() - 0.5) * 6, GROUND - 1, (rand() - 0.5) * 0.8, -0.2 - rand() * 0.2, 1);
  for (let i = 0; i < MAXP; i++) if (pKind[i] && pvy[i] > 0 && py[i] > GROUND + 1) pKind[i] = 0; // settled into the regolith
}

function drawActor() {
  rect(spr, cx - 7, hipY - 9, 4, 8, PACK_M); // jetpack on the back, nozzle underneath
  for (let y = hipY - 9; y < hipY - 1; y++) plot(spr, cx - 7, y, PACK_D);
  hline(spr, cx - 7, cx - 4, hipY - 10, SUIT_D); plot(spr, cx - 6, hipY - 1, PACK_D); plot(spr, cx - 6, hipY, PACK_D);
  capsule(spr, cx - 2, hipY - 7, 1.5, fhX, fhY, 1.4, SUIT_D, SUIT_D, SUIT_M); // far arm
  plot(spr, fhX, fhY, SUIT_D);
  for (let s = -1; s <= 1; s += 2) { // legs, tucking up in flight
    const bx = cx + s * 2 + bootDX, by = footY - 1 - bootUp;
    capsule(spr, cx + s * 1.5, hipY, 1.8, bx, Math.min(by, footY - 1), 1.7, SUIT_D, SUIT_M, SUIT_L);
    hline(spr, bx - 1, bx + 1, Math.min(by, footY - 1) + 1, PACK_D);
  }
  capsule(spr, cx, hipY - 1, 3.6, cx, hipY - 6, 3.8, SUIT_D, SUIT_M, SUIT_L); // suit body
  rect(spr, cx, hipY - 5, 2, 2, BLUE); plot(spr, cx + 2, hipY - 5, RED); plot(spr, cx + 2, hipY - 4, VISOR_M);
  capsule(spr, cx + 1, hipY - 11, 4.5, cx + 1, hipY - 11, 4.5, SUIT_D, SUIT_M, SUIT_L); // helmet
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { // gold visor
    if (dx * dx / 6.5 + dy * dy / 4.5 > 1) continue;
    plot(spr, cx + 3 + dx, hipY - 11 + dy, dx + dy > 1 ? VISOR_D : VISOR_M);
  }
  plot(spr, cx + 2, hipY - 12, VISOR_L); plot(spr, cx + 3, hipY - 12, VISOR_L);
  capsule(spr, cx + 2, hipY - 7, 1.6, nhX, nhY, 1.5, SUIT_D, SUIT_M, SUIT_L); // near arm with a red band
  plot(spr, cx + 2, hipY - 6, RED); plot(spr, nhX, nhY, SUIT_D); plot(spr, nhX + 1, nhY, SUIT_D);
}

function drawUnder() {
  const shift = Math.round(SC[SCROLL] * 0.5), sh = Math.round(SC[SCROLL]);
  for (let x = 0; x < W; x++) { // far ridge at half speed: a 40px pattern, so a loop's 40px shift closes
    const xm = x + shift, top = Math.round(56 + 2.5 * Math.sin(xm * 0.1571) + 1.5 * Math.sin(xm * 0.3142 + 1));
    for (let y = top; y < 72; y++) buf[y * W + x] = y === top ? MOON_M : FAR;
  }
  for (let x = 0; x < W; x++) { // near ground slides a full tile per hop
    const u = (x + sh) % TILE, top = GT[u], d = (u - 62) / 16, bowl = Math.abs(d) < 0.95;
    for (let y = top; y < H; y++) {
      const k = y - top;
      let c = k === 0 ? MOON_H : k < 3 ? MOON_L : k < 8 ? MOON_M : MOON_D;
      if (bowl && k < 6) c = d < 0 ? (k === 0 ? MOON_M : MOON_D) : k === 0 ? MOON_H : k < 4 ? MOON_L : MOON_M; // shadowed near wall, sunlit far wall
      if ((u * 7 + y * 13) % 31 === 0 && k > 1) c = MOON_D;
      buf[y * W + x] = c;
    }
  }
  const alt = Math.round(SC[ALT]), w = Math.max(1, 4 - (alt >> 3)), gy = GT[(AX + sh) % TILE]; // shadow shrinks as it rises
  hline(buf, AX - w, AX + w, gy, MOON_D);
}
function drawOver() {
  drawParticles(false);
  const thr = SC[THRUST];
  if (thr > 0.05) { // jet flame, flickering every other frame
    const len = Math.round(2 + thr * 8 + ((tick >> 1) & 1));
    halo(nzX, nzY + 2, Math.round(3 + thr * 4), FLAME_Y, FLAME_O);
    for (let k = 0; k < len; k++) {
      const w = k < len * 0.35 ? 1 : 0;
      hline(buf, nzX - w, nzX + w, nzY + 1 + k, k < 2 ? WHITE : k < len * 0.6 ? FLAME_Y : FLAME_O);
    }
  }
  if (state === LAND && stT >= TOUCH_T && stT < TOUCH_T + 24) { // a flat ring of dust rolling out from the boots
    const f = stT - TOUCH_T, rx = 3 + f * 0.9;
    for (let k = 0; k < 40; k++) {
      if (f > 12 && (k & 1)) continue;
      const a = k / 40 * 6.2832;
      plot(buf, Math.round(AX + Math.cos(a) * rx), Math.round(GROUND - 1 + Math.sin(a) * (1 + f * 0.12)), f < 10 ? MOON_H : MOON_L);
    }
  }
  drawParticles(true);
}
// #endregion

// #region ENGINE boot
checkContract();
buildBackground();
resize();
addEventListener('resize', resize);
const seek = /^#t=(\d+)(?:&crop=(\d+),(\d+),(\d+),(\d+))?$/.exec(location.hash);
if (seek) {
  if (seek[2]) {
    cropX = Math.min(+seek[2], W - 1); cropY = Math.min(+seek[3], H - 1);
    cropW = Math.max(1, Math.min(+seek[4], W - cropX)); cropH = Math.max(1, Math.min(+seek[5], H - cropY));
    resize();
  }
  // #t=N: simulate and render ticks 0..N (so errors on any of them surface), then hold tick N.
  // Passing the loop length also checks the seam: the actor at that tick must match tick 0.
  const loop = DUR.reduce((a, b) => a + b, 0), first = new Uint8Array(N);
  for (let t = 0, end = +seek[1]; t <= end; t++) {
    update();
    render();
    if (t === 0) first.set(spr);
    if (t === loop) {
      let diff = 0;
      for (let i = 0; i < N; i++) diff += first[i] !== spr[i];
      if (diff) console.error(`pixel-anims seam: actor differs by ${diff} px between tick 0 and tick ${loop}`);
    }
  }
} else {
  clock[0] = performance.now();
  requestAnimationFrame(frame);
}
// #endregion
})();
</script>
