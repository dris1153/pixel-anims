<title>Site backdrop</title>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #05060f; } canvas { display: block; }</style>
<canvas id="view" role="img" aria-label="Pixel art night backdrop for the pixel-anims site"></canvas>
<script type="module">
// The still of the live backdrop in site/src/sky: `pnpm posters --art sky-hero` renders it to public/art/sky-hero.png,
// the picture shown until the live canvas starts and on devices too weak to run it.
// const W = 400, H = 180 (render-posters reads this size)
import { paintStill } from '../src/sky/live.js';
paintStill(document.getElementById('view'));
</script>
